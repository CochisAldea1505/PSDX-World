========================================================= */

function teammatesOf(
    player
){

    return players.filter(

        other =>

            other.team===
            player.team &&

            other!==player

    );

}


/* =========================================================
   OPONENTES
========================================================= */

function opponentsOf(
    player
){

    return players.filter(

        other =>

            other.team!==
            player.team

    );

}


/* =========================================================
   OPONENTE MÁS CERCANO
========================================================= */

function nearestOpponent(
    player
){

    let nearest=null;

    let nearestDistance=
        Infinity;


    for(
        const other of players
    ){

        if(
            other.team===
            player.team
        ){

            continue;

        }


        const d=
            distance(
                player,
                other
            );


        if(
            d<
            nearestDistance
        ){

            nearest=
                other;

            nearestDistance=
                d;

        }

    }


    return{

        player:nearest,

        distance:nearestDistance

    };

}


/* =========================================================
   POSICIÓN BASE
========================================================= */

function getFormationAnchor(
    player
){

    return{

        x:player.baseX,

        y:player.baseY

    };

}


/* =========================================================
   DISTANCIA A BASE
========================================================= */

function distanceFromBase(
    player
){

    return Math.hypot(

        player.x-
        player.baseX,

        player.y-
        player.baseY

    );

}


/* =========================================================
   LIMITAR ZONA NATURAL
========================================================= */

function limitTargetToRoleZone(
    player,
    x,
    y
){

    const base=
        getFormationAnchor(
            player
        );


    /*
        IMPORTANTE:

        Esto ya NO es un muro.

        Solamente limita objetivos
        normales de apoyo.

        Un jugador que tiene balón
        puede salir de aquí.
    */

    const xRange=
        player.roleDepth+
        0.10;


    const yRange=
        player.roleWidth+
        0.10;


    return{

        x:
            clamp(
                x,
                base.x-xRange,
                base.x+xRange
            ),

        y:
            clamp(
                y,
                base.y-yRange,
                base.y+yRange
            )

    };

}


/* =========================================================
   ZONA DE RESPONSABILIDAD
========================================================= */

function isInsideNaturalZone(
    player,
    x,
    y
){

    const dx=
        Math.abs(
            x-player.baseX
        );


    const dy=
        Math.abs(
            y-player.baseY
        );


    return (

        dx<
        player.roleDepth+
        0.08 &&

        dy<
        player.roleWidth+
        0.08

    );

}


/* =========================================================
   REGRESO NATURAL
========================================================= */

function shouldReturnToFormation(
    player
){

    /*
        El balón le da permiso
        para abandonar la zona.
    */

    if(
        player.hasBall
    ){

        return false;

    }


    /*
        Si está persiguiendo
        una trayectoria,
        todavía está participando.
    */

    if(
        player.state===
        "chasingBall" ||

        player.state===
        "anticipating" ||

        player.state===
        "defending"
    ){

        return false;

    }


    /*
        Si tiene una responsabilidad
        defensiva activa, permanece.
    */

    if(
        player.assignedAttacker
    ){

        return false;

    }


    const d=
        distanceFromBase(
            player
        );


    /*
        Solo vuelve cuando
        realmente se ha alejado.
    */

    const limit=

        Math.max(
            player.roleDepth,
            player.roleWidth
        )+
        0.12;


    return d>limit;

}


/* =========================================================
   OBJETIVO DE AVANCE
========================================================= */

function chooseForwardTarget(
    player
){

    const direction=
        attackDirection(
            player
        );


    /*
        El jugador quiere avanzar
        desde SU posición actual.

        No desde la base.

        Esto evita que un LB
        que tiene el balón sea
        jalado constantemente
        hacia atrás.
    */

    let targetX=

        player.x+
        direction*
        0.14;


    let targetY=
        player.y;


    /*
        Pequeña búsqueda lateral.
    */

    const options=[

        {
            x:targetX,
            y:player.y
        },

        {
            x:targetX,
            y:
                player.y-
                0.08
        },

        {
            x:targetX,
            y:
                player.y+
                0.08
        }

    ];


    let best=
        options[0];

    let bestScore=
        -Infinity;


    for(
        const option of options
    ){

        let score=0;


        /*
            Preferimos espacio.
        */

        for(
            const opponent of opponentsOf(
                player
            )
        ){

            score+=
                clamp(

                    distance(
                        option,
                        opponent
                    ),

                    0,
                    0.25

                );

        }


        /*
            Preferimos avanzar.
        */

        score+=

            (
                option.x-
                player.x
            )*
            direction*
            1.5;


        if(
            score>
            bestScore
        ){

            bestScore=
                score;

            best=
                option;

        }

    }


    return{

        x:
            clamp(
                best.x,
                0.04,
                0.96
            ),

        y:
            clamp(
                best.y,
                0.05,
                0.95
            )

    };

}


/* =========================================================
   PREDICCIÓN DE TRAYECTORIA
========================================================= */

function predictBallPosition(
    seconds
){

    return{

        x:
            ball.x+
            ball.vx*
            seconds,

        y:
            ball.y+
            ball.vy*
            seconds

    };

}


/* =========================================================
   DISTANCIA DE UN PUNTO A LA TRAYECTORIA
========================================================= */

function distanceToBallTrajectory(
    player
){

    const speed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    if(
        speed<
        0.001
    ){

        return distance(
            player,
            ball
        );

    }


    const direction=
        normalize(
            ball.vx,
            ball.vy
        );


    const relativeX=
        player.x-
        ball.x;


    const relativeY=
        player.y-
        ball.y;


    const projection=

        relativeX*
        direction.x+

        relativeY*
        direction.y;


    const closestX=
        ball.x+
        direction.x*
        projection;


    const closestY=
        ball.y+
        direction.y*
        projection;


    return Math.hypot(

        player.x-
        closestX,

        player.y-
        closestY

    );

}


/* =========================================================
   ¿BALÓN VIENE HACIA EL JUGADOR?
========================================================= */

function ballApproachesPlayer(
    player
){

    const speed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    if(
        speed<
        0.02
    ){

        return false;

    }


    const direction=
        normalize(
            ball.vx,
            ball.vy
        );


    const toPlayer=
        normalize(

            player.x-
            ball.x,

            player.y-
            ball.y

        );


    const dot=

        direction.x*
        toPlayer.x+

        direction.y*
        toPlayer.y;


    return dot>0.55;

}


/* =========================================================
   ELEGIR RESPONSABLE DEL BALÓN
========================================================= */

function chooseBallChaser(team=null){

    if(
        !ball.flight
    ){

        return null;

    }


    let best=null;

    let bestScore=
        Infinity;


    const ballSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    for(
        const player of players
    ){

        /*
            Cada equipo puede reaccionar al balón suelto.
            El GK tiene su propia lógica y no compite aquí.
        */
        if(
            player.position==="GK" ||
            (team && player.team!==team)
        ){
            continue;
        }

        const directDistance=
            distance(
                player,
                ball
            );


        const trajectoryDistance=
            distanceToBallTrajectory(
                player
            );


        const approach=
            ballApproachesPlayer(
                player
            );


        const speed=
            getPlayerMaxSpeed(
                player
            );


        /*
            Estimamos cuánto tardaría
            en llegar.
        */

        const estimatedTime=

            directDistance/
            Math.max(
                speed,
                0.001
            );


        /*
            Trayectoria más limpia
            = mejor candidato.
        */

        let score=
            estimatedTime;


        score+=
            trajectoryDistance*
            1.8;


        /*
            Si ya está mirando
            hacia el balón,
            obtiene ventaja.
        */

        if(
            approach
        ){

            score-=
                0.08;

        }


        /*
            GK no debería abandonar
            su área por un balón normal.
        */

        if(
            player.position===
            "GK"
        ){

            score+=
                0.20;

        }


        /*
            Un jugador muy alejado
            de su zona necesita
            una razón más fuerte.
        */

        if(
            !isInsideNaturalZone(

                player,

                ball.x,

                ball.y

            )
        ){

            score+=
                0.10;

        }


        /*
            SPD realmente influye.
        */

        score-=
            player.stats.SPD*
            0.006;


        /*
            Si el balón es muy rápido,
            favorecemos jugadores
            con mejor velocidad.
        */

        if(
            ballSpeed>
            0.25
        ){

            score-=
                player.stats.SPD*
                0.010;

        }


        if(
            score<
            bestScore
        ){

            bestScore=
                score;

            best=
                player;

        }

    }


    return best;

}


/* =========================================================
   MOVIMIENTO HACIA BALÓN
========================================================= */

function updateBallChaser(){

    if(
        !ball.flight
    ){

        return;

    }


    /*
        ========================================================
        BALÓN LIBRE — REACCIÓN DE AMBOS EQUIPOS
        ========================================================

        No queremos que los 10 jugadores corran detrás
        del balón.

        Cada equipo tiene:

        1 jugador principal que intenta llegar primero.
        Hasta 2 jugadores cercanos que reaccionan como apoyo.

        Los demás conservan su zona/formación.
    */

    const homeChaser=
        chooseBallChaser("HOME");

    const awayChaser=
        chooseBallChaser("AWAY");


    const chasers=
        [
            homeChaser,
            awayChaser
        ].filter(Boolean);


    const supportPlayers=[];


    /*
        Un jugador cercano puede reaccionar aunque
        no sea el principal perseguidor.

        La trayectoria importa: un jugador que esté
        cerca del camino del balón puede reaccionar
        aunque esté un poco más lejos del balón actual.
    */

    for(
        const team of [
            "HOME",
            "AWAY"
        ]
    ){

        const mainChaser=
            team==="HOME"
            ? homeChaser
            : awayChaser;


        const candidates=
            players
            .filter(
                player =>
                    player.team===team &&
                    player.position!=="GK" &&
                    player!==mainChaser
            )
            .map(
                player => {

                    const directDistance=
                        distance(
                            player,
                            ball
                        );


                    const trajectoryDistance=
                        distanceToBallTrajectory(
                            player
                        );


                    /*
                        La reacción secundaria solamente
                        existe cerca de la jugada.

                        No queremos que un LB situado en
                        la otra banda atraviese medio campo
                        porque vio el balón.
                    */

                    const isNearPlay=
                        directDistance<=0.28 ||
                        trajectoryDistance<=0.085;


                    if(
                        !isNearPlay
                    ){

                        return null;

                    }


                    let score=
                        directDistance+
                        trajectoryDistance*
                        1.35;


                    /*
                        Favorecemos un poco a los jugadores
                        que ya están en la trayectoria.
                    */

                    if(
                        ballApproachesPlayer(
                            player
                        )
                    ){

                        score-=0.06;

                    }


                    /*
                        Un jugador muy fuera de su zona
                        puede reaccionar, pero necesita estar
                        realmente cerca.
                    */

                    if(
                        !isInsideNaturalZone(
                            player,
                            ball.x,
                            ball.y
                        )
                    ){

                        score+=0.045;

                    }


                    return{
                        player,
                        score,
                        directDistance,
                        trajectoryDistance
                    };

                }
            )
            .filter(Boolean)
            .sort(
                (a,b)=>
                    a.score-b.score
            );


        /*
            Máximo DOS apoyos por equipo.

            Esto permite ver a varios jugadores
            reaccionando, pero evita el enjambre.
        */

        for(
            const candidate of candidates.slice(0,2)
        ){

            supportPlayers.push(
                candidate.player
            );

        }

    }


    /*
        ========================================================
        ACTUALIZAR COMPORTAMIENTO
        ========================================================
    */

    for(
        const player of players
    ){

        if(
            player.position==="GK"
        ){

            continue;

        }


        /*
            RESPONSABLE PRINCIPAL
        */

        if(
            chasers.includes(player)
        ){

            player.state=
                "chasingBall";

            player.activeDuty=
                true;


            if(
                ballApproachesPlayer(
                    player
                )
            ){

                const prediction=
                    predictBallPosition(
                        0.15
                    );


                player.targetX=
                    clamp(
                        prediction.x,
                        0.03,
                        0.97
                    );


                player.targetY=
                    clamp(
                        prediction.y,
                        0.03,
                        0.97
                    );


                player.state=
                    "anticipating";

            }
            else{

                player.targetX=
                    ball.x;

                player.targetY=
                    ball.y;

            }


            continue;

        }


        /*
            APOYO CERCANO

            No persigue exactamente al balón.
            Se mueve ligeramente hacia una posición
            útil cerca de su trayectoria.

            Esto da la sensación de que el jugador
            está reaccionando sin abandonar
            completamente su función.
        */

        if(
            supportPlayers.includes(
                player
            )
        ){

            const prediction=
                predictBallPosition(
                    0.18
                );


            const towardX=
                prediction.x-player.x;

            const towardY=
                prediction.y-player.y;


            const length=
                Math.hypot(
                    towardX,
                    towardY
                );


            if(
                length>0.001
            ){

                /*
                    Solo avanzamos una parte del camino.
                    El apoyo NO corre hasta el balón.
                */

                const supportDistance=
                    Math.min(
                        0.10,
                        length*
                        0.42
                    );


                player.targetX=
                    clamp(
                        player.x+
                        towardX/length*
                        supportDistance,
                        0.03,
                        0.97
                    );


                player.targetY=
                    clamp(
                        player.y+
                        towardY/length*
                        supportDistance,
                        0.03,
                        0.97
                    );

            }
            else{

                player.targetX=
                    player.x;

                player.targetY=
                    player.y;

            }


            player.state=
                "supportBall";

            player.activeDuty=
                false;


            continue;

        }


        /*
            TODOS LOS DEMÁS

            No reaccionan al balón libre.

            Regresan a su comportamiento normal.
        */

        if(
            player.state==="chasingBall" ||
            player.state==="anticipating" ||
            player.state==="supportBall"
        ){

            player.state=
                "support";

            player.activeDuty=
                false;

        }

    }

}

/* =========================================================
   ASIGNAR DEFENSOR PRINCIPAL
========================================================= */

function assignDefensiveResponsibility(
    attackingTeam
){

    if(
        !ball.owner
    ){

        return;

    }


    const attacker=
        ball.owner;


    if(
        attacker.team!==
        attackingTeam
    ){

        return;

    }


    const defenders=
        players.filter(

            player =>

                player.team!==
                attackingTeam &&

                player.position!==
                "GK"

        );


    /*
        Primero limpiamos
        responsabilidades anteriores.
    */

    for(
        const defender of defenders
    ){

        defender.assignedAttacker=
            null;

    }


    /*
        Buscar defensores cercanos.
    */

    const candidates=
        defenders
        .map(

            defender => ({

                player:defender,

                distance:
                    distance(
                        defender,
                        attacker
                    ),

                zoneDistance:
                    distance(

                        {
                            x:defender.baseX,
                            y:defender.baseY
                        },

                        {
                            x:attacker.x,
                            y:attacker.y
                        }

                    )

            })

        )
        .sort(

            (a,b)=>

                a.distance-
                b.distance

        );


    /*
        Solo el mejor candidato
        recibe la responsabilidad
        directa.

        El resto cubre.
    */

    if(
        candidates.length
    ){

        const primary=
            candidates[0].player;


        primary.assignedAttacker=
            attacker;


        primary.activeDuty=
            true;


        primary.state=
            "defending";

    }


    /*
        Segundo defensor:

        no va directamente
        al atacante.

        Solamente cubre.
    */

    if(
        candidates.length>1
    ){

        const cover=
            candidates[1].player;


        cover.assignedAttacker=
            null;


        cover.activeDuty=
            true;


        cover.state=
            "covering";

    }

}


/* =========================================================
   DEFENSA
========================================================= */

function updateDefenseAI(
    attackingTeam
){

    if(
        !ball.owner
    ){

        return;

    }


    const attacker=
        ball.owner;


    if(
        attacker.team!==
        attackingTeam
    ){

        return;

    }


    /*
        Portero en posesión:
        no se presiona ni se asigna
        defensor al GK. Ambos equipos
        se reorganizan mientras el
        portero decide distribuir.
    */
    if(
        attacker.position==="GK"
    ){

        for(
            const player of players
        ){

            if(
                player===attacker
            ){

                continue;

            }


            player.assignedAttacker=
                null;

            player.activeDuty=
                false;

            player.targetX=
                player.baseX;

            player.targetY=
                player.baseY;


            if(
                player.state!=="goalkeeper"
            ){

                player.state=
                    "support";

            }

        }


        return;

    }


    assignDefensiveResponsibility(
        attackingTeam
    );


    const defenders=
        players.filter(

            player =>

                player.team!==
                attackingTeam

        );


    for(
        const defender of defenders
    ){

        /*
            GK:
            permanece cerca
            de la portería.
        */

        if(
            defender.position===
            "GK"
        ){

            defender.targetX=
                defender.baseX;


            defender.targetY=
                lerp(

                    defender.baseY,

                    clamp(
                        ball.y,
                        0.35,
                        0.65
                    ),

                    0.35

                );


            defender.state=
                "goalkeeping";


            continue;

        }


        /*
        =====================================================
            DEFENSOR PRINCIPAL
        =====================================================
        */

        if(
            defender.assignedAttacker===
            attacker
        ){

            const direction=
                attackDirection(
                    attacker
                );


            /*
                No se pega al atacante.

                Se coloca ligeramente
                delante.
            */

            const targetX=

                attacker.x-
                direction*
                0.045;


            const targetY=
                attacker.y;


            defender.targetX=
                clamp(
                    targetX,
                    0.04,
                    0.96
                );


            defender.targetY=
                clamp(
                    targetY,
                    0.06,
                    0.94
                );


            defender.state=
                "defending";


            continue;

        }


        /*
        =====================================================
            DEFENSOR DE COBERTURA
        =====================================================
        */

        if(
            defender.state===
            "covering"
        ){

            const direction=
                attackDirection(
                    attacker
                );


            /*
                Se acerca un poco,
                pero no abandona
                completamente su zona.
            */

            let targetX=

                lerp(

                    defender.baseX,

                    attacker.x-
                    direction*
                    0.12,

                    0.25

                );


            let targetY=

                lerp(

                    defender.baseY,

                    attacker.y,

                    0.18

                );


            const limited=
                limitTargetToRoleZone(

                    defender,

                    targetX,

                    targetY

                );


            defender.targetX=
                limited.x;


            defender.targetY=
                limited.y;


            continue;

        }


        /*
        =====================================================
            OTROS DEFENSORES
        =====================================================
        */

        /*
            Si la trayectoria del balón
            se aproxima a su zona,
            dan un pequeño paso.
        */

        const trajectoryDistance=
            distanceToBallTrajectory(
                defender
            );


        if(

            ball.owner===null &&

            trajectoryDistance<
            0.12

        ){

            const prediction=
                predictBallPosition(
                    0.18
                );


            const limited=
                limitTargetToRoleZone(

                    defender,

                    prediction.x,

                    prediction.y

                );


            defender.targetX=
                limited.x;


            defender.targetY=
                limited.y;


            defender.state=
                "anticipating";


            continue;

        }


        /*
            Si el balón está
            muy lejos de su zona,
            vuelve.
        */

        defender.targetX=
            defender.baseX;


        defender.targetY=
            defender.baseY;


        defender.state=
            "formation";

    }

}


/* =========================================================
   APOYO OFENSIVO
========================================================= */

function updateSupportAI(
    team
){

    const owner=
        ball.owner;


    for(
        const player of players
    ){

        if(
            player.team!==team
        ){

            continue;

        }


        /*
            Portador.
        */

        if(
            player===owner
        ){

            continue;

        }

        /* Apoyo temporal: un solo jugador acompaña la jugada. */
        if(player.supportUntil && performance.now()<player.supportUntil){
            player.targetX=player.supportTargetX;
            player.targetY=player.supportTargetY;
            player.state="support";
            continue;
        }else if(player.supportUntil){
            player.supportUntil=0;
            player.supportTargetX=null;
            player.supportTargetY=null;
            player.supportMode=null;
        }


        /*
            Si está persiguiendo
            un balón libre,
            no interferimos.
        */

        if(

            player.state===
            "chasingBall" ||

            player.state===
            "anticipating"

        ){

            continue;

        }


        const base=
            getFormationAnchor(
                player
            );


        let targetX=
            base.x;


        let targetY=
            base.y;


        /*
        =====================================================
            BALÓN DEL PROPIO EQUIPO
        =====================================================
        */

        if(

            owner &&

            owner.team===
            team

        ){

            const direction=
                attackDirection(
                    player
                );


            /*
                DISTANCIA AL PORTADOR
            */

            const d=
                distance(
                    player,
                    owner
                );


            /*
                No queremos que todos
                vayan hacia él.
            */

            switch(
                player.position
            ){

                case "GK":

                    targetX=
                        base.x;

                    targetY=
                        base.y;

                    break;


                case "CB":

                    /*
                        Mantiene su línea.

                        Solo avanza
                        ligeramente.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.018;


                    targetY=
                        base.y;

                    break;


                case "LB":
                case "RB":

                    /*
                        Laterales:

                        acompañan,
                        pero principalmente
                        por su banda.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.055;


                    targetY=
                        base.y;

                    break;


                case "CM":

                    /*
                        Los CM sí pueden
                        acercarse algo
                        a la jugada.

                        Pero no siguen
                        al portador.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.065;


                    targetY=
                        lerp(

                            base.y,

                            owner.y,

                            0.12

                        );

                    break;


                case "LW":
                case "RW":

                    /*
                        Extremos:

                        mantienen anchura.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.075;


                    targetY=
                        base.y;

                    break;


                case "AM":

                    /*
                        El mediapunta
                        tiene más libertad.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.08;


                    targetY=
                        lerp(

                            base.y,

                            owner.y,

                            0.18

                        );

                    break;


                case "ST":

                    /*
                        El delantero
                        ataca espacio,
                        no corre hacia
                        el balón.
                    */

                    targetX=
                        base.x+
                        direction*
                        0.10;


                    targetY=
                        lerp(

                            base.y,

                            owner.y,

                            0.08

                        );

                    break;


                default:

                    targetX=
                        base.x;

                    targetY=
                        base.y;

            }


            /*
                Si está demasiado cerca
                del portador,
                se aleja un poco.

                Esto evita el amontonamiento.
            */

            if(
                d<
                0.09
            ){

                const away=
                    normalize(

                        player.x-
                        owner.x,

                        player.y-
                        owner.y

                    );


                targetX+=
                    away.x*
                    0.08;


                targetY+=
                    away.y*
                    0.08;

            }

        }


        /*
        =====================================================
            SIN BALÓN
        =====================================================
        */

        else{

            /*
                Regreso suave.
            */

            targetX=
                lerp(

                    player.x,

                    base.x,

                    0.10

                );


            targetY=
                lerp(

                    player.y,

                    base.y,

                    0.10

                );

        }


        /*
        =====================================================
            LIMITACIÓN NATURAL
        =====================================================
        */

        const limited=
            limitTargetToRoleZone(

                player,

                targetX,

                targetY

            );


        player.targetX=
            limited.x;


        player.targetY=
            limited.y;


        /*
            No lo llamamos "formation"
            constantemente.

            Eso permite que mantenga
            pequeños desplazamientos.
        */

        player.state=
            "support";

    }

}


/* =========================================================
   ERROR DE PASE
========================================================= */

function passErrorFromTEC(
    TEC
){

    const quality=
        clamp(
            TEC/10,
            0,
            1
        );


    const maximumError=

        (
            1-quality
        )*
        0.42;


    return(

        Math.random()*2-1

    )*
    maximumError;

}


/* =========================================================
   PASE
========================================================= */

function passBall(
    passer,
    receiver
){

    if(
        ball.owner!==passer
    ){

        return false;

    }


    const rawDirection={

        x:
            receiver.x-
            passer.x,

        y:
            receiver.y-
            passer.y

    };


    const baseDirection=
        normalize(
            rawDirection.x,
            rawDirection.y
        );


    const error=
        passErrorFromTEC(
            passer.stats.TEC
        );


    const direction=
        rotate(
            baseDirection,
            error
        );


    const distanceToReceiver=
        distance(
            passer,
            receiver
        );


    const power=

        CONFIG.passPower*
        (
            0.55+
            passer.stats.POW*
            0.075
        );


    const speed=

        power*
        (
            0.70+
            clamp(
                distanceToReceiver,
                0.05,
                0.75
            )
        );


    passer.hasBall=false;

    passer.state=
        "passing";


    ball.owner=null;

    ball.flight=true;

    ball.state=
        "pass";


    ball.x=
        passer.x;

    ball.y=
        passer.y;


    ball.vx=
        direction.x*
        speed;


    ball.vy=
        direction.y*
        speed;


    ball.lastTeam=
        passer.team;


    ball.type=
        "pass";


    ball.target=
        receiver;

    /*
        Guardamos el origen del pase.
        El emisor queda temporalmente fuera
        de la intercepción mientras el balón
        todavía está saliendo de sus pies.
    */
    ball.lastPasser=
        passer;

    ball.passOriginX=
        passer.x;

    ball.passOriginY=
        passer.y;

    ball.gkSaveAttempted=false;


    log(

        passer.name+
        " PASA a "+
        receiver.name+
        " | TEC "+
        passer.stats.TEC+
        " | POW "+
        passer.stats.POW

    );


    return true;

}


/* =========================================================
   TIRO
========================================================= */

function shootBall(
    player
){

    if(
        ball.owner!==player
    ){

        return false;

    }


    const goalX=
        player.team==="HOME"
        ? 1.03
        : -0.03;


    const rawDirection={

        x:
            goalX-player.x,

        y:
            0.50-player.y

    };


    const baseDirection=
        normalize(
            rawDirection.x,
            rawDirection.y
        );


    const error=
        passErrorFromTEC(
            player.stats.TEC
        );


    const direction=
        rotate(
            baseDirection,
            error*
            0.75
        );


    const speed=

        CONFIG.shotPower*
        (
            0.70+
            player.stats.POW*
            0.075
        );


    player.hasBall=false;

    player.state=
        "shooting";


    ball.owner=null;

    ball.flight=true;

    ball.state=
        "shot";


    ball.x=
        player.x;

    ball.y=
        player.y;


    ball.vx=
        direction.x*
        speed;


    ball.vy=
        direction.y*
        speed;


    ball.lastTeam=
        player.team;


    ball.type=
        "shot";


    ball.target=null;

    ball.gkSaveAttempted=false;


    log(

        player.name+
        " PATEA | TEC "+
        player.stats.TEC+
        " | POW "+
        player.stats.POW

    );


    return true;

}


/* =========================================================
   FACTOR DE INTERCEPCIÓN
========================================================= */

function approachFactor(
    player
){

    const directionToBall=
        normalize(

            ball.x-
            player.x,

            ball.y-
            player.y

        );


    const speed=
        Math.hypot(
            player.vx,
            player.vy
        );


    if(
        speed<
        0.001
    ){

        return 0;

    }


    return(

        player.vx*
        directionToBall.x+

        player.vy*
        directionToBall.y

    )/
    speed;

}


/* =========================================================
   INTERCEPCIÓN
========================================================= */

function checkBallInterceptions(){

    if(
        !ball.flight
    ){

        return;

    }


    const ballSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    /*
        Revisamos todos los jugadores.

        Pero solo aquel que realmente
        está llegando a la trayectoria
        puede ganar el balón.
    */

    let bestPlayer=null;

    let bestScore=
        Infinity;


    for(
        const player of players
    ){

        /*
            El GK tiene su propia física de atajada.
            No debe competir con los jugadores de campo
            mediante la intercepción normal.
        */

        if(
            player.position==="GK"
        ){

            continue;

        }


        /*
            Un jugador no puede interceptar
            su propio pase mientras el balón
            todavía está saliendo de su zona
            de origen.

            Esto evita el absurdo:
                jugador -> pase -> "¡intercepta!"
                -> recupera su propio pase.
        */
        if(
            ball.type==="pass" &&
            ball.lastPasser===player
        ){

            const passTravel=
                Math.hypot(
                    ball.x-ball.passOriginX,
                    ball.y-ball.passOriginY
                );

            if(
                passTravel<
                0.085
            ){

                continue;

            }

        }


        const d=
            distance(
                player,
                ball
            );


        if(
            d>
            CONFIG.possessionDistance+
            0.012
        ){

            continue;

        }


        const approach=
            approachFactor(
                player
            );


        const speed=
            Math.hypot(
                player.vx,
                player.vy
            );


        const reach=

            speed*
            0.70+

            player.stats.SPD*
            0.004+

            player.stats.DEF*
            0.003+

            Math.max(
                0,
                approach
            )*
            0.014;


        if(

            reach>
            ballSpeed*
            0.42

            ||

            ballSpeed<
            0.08

        ){

            /*
                Menor distancia
                y mayor velocidad
                = mejor control.
            */

            const score=

                d-

                speed*
                0.04-

                player.stats.SPD*
                0.002;


            if(
                score<
                bestScore
            ){

                bestScore=
                    score;

                bestPlayer=
                    player;

            }

        }

    }


    if(
        bestPlayer
    ){

        giveBallTo(
            bestPlayer
        );


        log(

            bestPlayer.name+
            " CONTROLA / INTERCEPTA el balón."

        );

    }

}


/* =========================================================
   PORTERO — FÍSICA DE ATAJADAS
========================================================= */

function getGoalkeeper(
    team
){

    return players.find(

        player =>

            player.team===team &&

            player.position==="GK"

    );

}


/*
    Predice dónde cruzará el balón
    la línea de la portería.
*/
function predictGoalkeeperIntercept(
    gk
){

    if(
        !ball.flight
    ){

        return null;

    }


    const goalX=
        gk.team==="HOME"
        ? 0
        : 1;


    /*
        El tiro debe ir hacia la portería
        que protege este portero.
    */
    if(
        gk.team==="HOME" &&
        ball.vx>=0
    ){

        return null;

    }


    if(
        gk.team==="AWAY" &&
        ball.vx<=0
    ){

        return null;

    }


    if(
        Math.abs(ball.vx)<0.0001
    ){

        return null;

    }


    const time=
        (goalX-ball.x)/ball.vx;


    if(
        time<=0
    ){

        return null;

    }


    const predictedY=
        ball.y+
        ball.vy*time;


    return{

        x:goalX,

        y:predictedY,

        time:time

    };

}


/*
    Velocidad vertical del portero.
    SPD es movimiento; KEP no aumenta
    la velocidad del jugador.
*/
function goalkeeperMoveSpeed(
    gk
){

    return(
        0.050+
        gk.stats.SPD*0.009
    );

}


/*
    El portero se mueve hacia la zona
    donde predice que llegará el tiro.
*/
function updateGoalkeeperMovement(
    gk,
    delta
){

    const prediction=
        predictGoalkeeperIntercept(gk);


    if(
        !prediction
    ){

        /*
            Si no hay tiro a portería,
            vuelve suavemente a su zona.
        */
        gk.targetY=
            lerp(
                gk.targetY,
                gk.baseY,
                0.10
            );

        movePlayer(
            gk,
            gk.baseX,
            gk.targetY,
            delta
        );

        return;

    }


    /*
        La trayectoria puede salir de la portería.
        En ese caso el GK solo sigue una zona
        razonable, no abandona su arco.
    */
    const targetY=
        clamp(
            prediction.y,
            0.31,
            0.69
        );


    const response=
        clamp(
            0.20+
            gk.stats.KEP*0.035,
            0.20,
            0.55
        );


    gk.targetY=
        lerp(
            gk.y,
            targetY,
            response
        );


    const dy=
        gk.targetY-gk.y;


    const maxMove=
        goalkeeperMoveSpeed(gk)*delta;


    gk.y+=
        clamp(
            dy,
            -maxMove,
            maxMove
        );


    gk.y=
        clamp(
            gk.y,
            0.30,
            0.70
        );


    gk.x=
        gk.baseX;

}


/*
    Capacidad de alcance del portero.

    KEP = alcance/control de atajada.
    SPD = capacidad de llegar a tiempo.

    La pequeña variación -1/0/+1
    evita que el mismo KEP produzca
    siempre exactamente el mismo resultado.
*/
function goalkeeperAbility(
    gk
){

    const kep=
        clamp(
            gk.stats.KEP+
            randomStatModifier(),
            0,
            10
        );


    const spd=
        clamp(
            gk.stats.SPD+
            randomStatModifier(),
            0,
            10
        );


    return{

        kep:kep,

        spd:spd

    };

}


/*
    Resuelve la atajada sin usar
    un porcentaje fijo.

    El tiro se evalúa por:
      - velocidad del balón
      - distancia lateral
      - tiempo de reacción

    El portero responde con:
      - KEP
      - SPD
      - variación pequeña
*/
/* =========================================================
   COLISIÓN FÍSICA BALÓN ↔ GK
   Solo hay atajada si las circunferencias se tocan.
========================================================= */
function goalkeeperCollisionRadius(){
    return CONFIG.playerRadius + CONFIG.ballRadius;
}
function segmentCircleCollision(x1,y1,x2,y2,cx,cy,radius){
    const dx=x2-x1, dy=y2-y1;
    const lengthSq=dx*dx+dy*dy;
    let t=0;
    if(lengthSq>0){
        t=((cx-x1)*dx+(cy-y1)*dy)/lengthSq;
        t=clamp(t,0,1);
    }
    const closestX=x1+dx*t, closestY=y1+dy*t;
    const distanceToCenter=Math.hypot(cx-closestX,cy-closestY);
    return {hit:distanceToCenter<=radius,x:closestX,y:closestY,distance:distanceToCenter};
}
function goalkeeperBallContact(gk,previousX,previousY){
    if(!gk || !ball.flight || ball.owner) return null;
    const collision=segmentCircleCollision(previousX,previousY,ball.x,ball.y,gk.x,gk.y,goalkeeperCollisionRadius());
    return collision.hit ? collision : null;
}

function resolveGoalkeeperSave(
    gk,
    prediction
){

    if(
        ball.gkSaveAttempted
    ){

        return "miss";

    }


    const ability=
        goalkeeperAbility(gk);


    const ballSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    const lateralDistance=
        Math.abs(
            prediction.y-gk.y
        );


    /* El contacto físico ya fue comprobado; KEP decide el resultado. */


    const speedDifficulty=
        ballSpeed*0.95;


    const reactionDifficulty=
        clamp(
            0.42-
            prediction.time,
            0,
            0.42
        )*3.0;


    const distanceDifficulty=
        lateralDistance*5.0;


    const difficulty=
        speedDifficulty+
        reactionDifficulty+
        distanceDifficulty;


    const control=
        ability.kep*0.78+
        ability.spd*0.22;


    const margin=
        control-difficulty;


    ball.gkSaveAttempted=true;


    log(
        "🧤 "+gk.name+
        " REACCIONA | KEP "+
        ability.kep+
        " | SPD "+
        ability.spd
    );


    /*
        Gran margen:
        control limpio.
    */
    if(
        margin>=2.0
    ){

        goalkeeperCatch(gk);

        log(
            "🧤 "+gk.name+
            " ATRAPA EL BALÓN."
        );

        return "catch";

    }


    /*
        Margen intermedio:
        alcanza el balón pero no
        consigue controlarlo limpio.
    */
    if(
        margin>=-0.8
    ){

        goalkeeperParry(gk);

        log(
            "🧤 "+gk.name+
            " DESVÍA EL TIRO."
        );

        return "parry";

    }


    log(
        "🧤 "+gk.name+
        " NO LOGRA CONTROLAR EL TIRO."
    );


    return "miss";

}


/*
    El GK atrapa el balón.
*/
function goalkeeperCatch(
    gk
){

    if(
        ball.owner
    ){

        return;

    }


    ball.owner=gk;

    gk.hasBall=true;

    gk.state="goalkeeper";

    gk.activeDuty=false;

    gk.dutyTimer=0;


    ball.flight=false;

    ball.state="goalkeeper";

    ball.type=null;

    ball.vx=0;

    ball.vy=0;

    ball.x=gk.x;

    ball.y=gk.y;


    log(
        "🧤 "+gk.name+
        " CONTROLA EL BALÓN."
    );

}


/*
    El GK desvía el balón físicamente.
*/
function goalkeeperParry(
    gk
){

    const horizontal=
        gk.team==="HOME"
        ? 1
        : -1;


    const vertical=
        ball.y<gk.y
        ? -1
        : 1;


    const oldSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    const direction=
        normalize(
            horizontal,
            vertical*0.70
        );


    const newSpeed=
        Math.max(
            0.12,
            oldSpeed*0.58
        );


    ball.owner=null;

    gk.hasBall=false;

    gk.state="formation";


    ball.flight=true;

    ball.state="save_rebound";

    ball.type="save_rebound";

    ball.x=
        gk.x+
        horizontal*0.025;

    ball.y=
        gk.y+
        vertical*0.025;

    ball.vx=
        direction.x*newSpeed;

    ball.vy=
        direction.y*newSpeed;

    ball.lastTeam=gk.team;

    ball.gkSaveAttempted=false;

}


/*
    Cuando el GK atrapa, nadie puede
    quitárselo. Todos tienen tiempo
    para reorganizarse y después el
    portero despeja.
*/
function goalkeeperChooseDistribution(
    gk
){

    if(
        ball.owner!==gk
    ){

        return;

    }


    /*
        El GK decide entre pase corto
        y despeje.

        No usamos una probabilidad fija:
        depende de espacio, distancia y
        presión rival.
    */

    const teammates=
        teammatesOf(gk)
        .filter(
            player =>
                player.position!=="GK"
        );


    if(
        teammates.length===0
    ){

        goalkeeperClear(gk);

        return;

    }


    const candidates=
        teammates
        .map(
            teammate => {

                const d=
                    distance(
                        gk,
                        teammate
                    );


                const opponent=
                    opponentsOf(
                        teammate
                    )
                    .filter(
                        player =>
                            player.position!=="GK"
                    )
                    .sort(
                        (a,b)=>
                            distance(
                                teammate,
                                a
                            )-
                            distance(
                                teammate,
                                b
                            )
                    )[0];


                const pressure=
                    opponent
                    ? distance(
                        teammate,
                        opponent
                    )
                    : 1;


                /*
                    Más cerca + más espacio
                    = mejor opción de pase.
                */

                const score=
                    d+
                    Math.max(
                        0,
                        0.16-pressure
                    )*2.0;


                return{
                    player:teammate,
                    distance:d,
                    space:pressure,
                    score:score
                };

            }
        )
        .sort(
            (a,b)=>
                a.score-b.score
        );


    const best=
        candidates[0];


    /*
        Un pase corto y con espacio
        es preferible al despeje.

        Si no hay una opción razonable,
        despeja.
    */

    if(
        best &&
        best.distance<0.36 &&
        best.space>0.13
    ){

        const passed=
            passBall(
                gk,
                best.player
            );


        if(
            passed
        ){

            log(
                "🧤 "+
                gk.name+
                " DECIDE PASAR A "+
                best.player.name
            );

            return;

        }

    }


    goalkeeperClear(gk);

}


function updateGoalkeeperPossession(
    gk,
    delta
){

    if(
        ball.owner!==gk
    ){

        return;

    }


    ball.x=gk.x;

    ball.y=gk.y;


    gk.targetX=gk.baseX;

    gk.targetY=gk.baseY;

    gk.state="goalkeeper";


    gk.dutyTimer+=delta;


    /*
        Durante esta ventana el GK
        conserva la pelota.
    */
    if(
        gk.dutyTimer<1.10
    ){

        return;

    }


    /*
        Ahora el GK decide:
        pase seguro o despeje.
    */
    goalkeeperChooseDistribution(
        gk
    );

}


/*
    Despeje del portero.

    POW = potencia del golpe.
    TEC = precisión de dirección.
*/
function goalkeeperClear(
    gk
){

    if(
        ball.owner!==gk
    ){

        return;

    }


    const direction=
        gk.team==="HOME"
        ? 1
        : -1;


    const teammates=
        teammatesOf(gk)
        .filter(
            player =>
                player.position!=="GK"
        )
        .sort(
            (a,b)=>
                (b.x*direction)-
                (a.x*direction)
        );


    const target=
        teammates[0];


    let targetX=
        gk.x+
        direction*0.40;

    let targetY=0.50;


    if(target){

        targetX=target.x;

        targetY=target.y;

    }


    const baseDirection=
        normalize(
            targetX-gk.x,
            targetY-gk.y
        );


    const error=
        passErrorFromTEC(
            gk.stats.TEC
        );


    const directionVector=
        rotate(
            baseDirection,
            error
        );


    const speed=
        CONFIG.shotPower*
        (
            0.70+
            gk.stats.POW*0.075
        );


    gk.hasBall=false;

    gk.state="clearing";

    gk.dutyTimer=0;


    ball.owner=null;

    ball.flight=true;

    ball.state="goalkeeper_clear";

    ball.type="goalkeeper_clear";

    ball.x=gk.x;

    ball.y=gk.y;

    ball.vx=directionVector.x*speed;

    ball.vy=directionVector.y*speed;

    ball.lastTeam=gk.team;

    ball.target=target||null;

    /*
        El despeje inicia una nueva acción:
        el GK deja de ser el pasador protegido.
    */
    ball.lastPasser=
        gk;

    ball.passOriginX=
        gk.x;

    ball.passOriginY=
        gk.y;

    ball.gkSaveAttempted=false;


    log(
        "🧤 "+gk.name+
        " DESPEJA | POW "+
        gk.stats.POW+
        " | TEC "+
        gk.stats.TEC
    );

}


/* =========================================================
   FÍSICA DEL BALÓN
========================================================= */

function updateBall(
    delta
){

    if(
        ball.owner
    ){

        if(
            ball.owner.position==="GK"
        ){

            updateGoalkeeperPossession(
                ball.owner,
                delta
            );

        }
        else{

            ball.x=
                ball.owner.x;

            ball.y=
                ball.owner.y;

        }

        return;

    }


    if(
        !ball.flight
    ){

        return;

    }


    const previousBallX=ball.x;
    const previousBallY=ball.y;

    ball.x+=
        ball.vx*
        delta;


    ball.y+=
        ball.vy*
        delta;


    const friction=
        Math.max(

            0,

            1-
            CONFIG.ballFriction*
            delta

        );


    ball.vx*=
        friction;


    ball.vy*=
        friction;


    /*
    ========================================================
        PORTEROS
    ========================================================
    */

    const homeGK=
        getGoalkeeper("HOME");

    const awayGK=
        getGoalkeeper("AWAY");


    if(homeGK){

        updateGoalkeeperMovement(
            homeGK,
            delta
        );

    }


    if(awayGK){

        updateGoalkeeperMovement(
            awayGK,
            delta
        );

    }


    /*
    ========================================================
        ATAJADAS
    ========================================================
    */

    /*
    ========================================================
        ATAJADAS — SOLO CON CONTACTO FÍSICO
    ========================================================
    */

    if(
        ball.flight &&
        !ball.gkSaveAttempted
    ){

        for(const gk of [homeGK,awayGK]){
            if(!gk) continue;
            const contact=goalkeeperBallContact(gk,previousBallX,previousBallY);
            if(!contact) continue;
            const prediction=predictGoalkeeperIntercept(gk);
            if(!prediction) continue;
            const result=resolveGoalkeeperSave(gk,prediction);
            if(result==="catch" || result==="parry") return;
        }

    }

    /*
    ========================================================
        PARED SUPERIOR
    ========================================================
    */

    if(
        ball.y<=
        CONFIG.ballRadius
    ){

        ball.y=
            CONFIG.ballRadius;


        ball.vy=
            Math.abs(
                ball.vy
            )*
            0.65;

    }


    /*
    ========================================================
        PARED INFERIOR
    ========================================================
    */

    if(
        ball.y>=
        1-CONFIG.ballRadius
    ){

        ball.y=
            1-CONFIG.ballRadius;


        ball.vy=
            -Math.abs(
                ball.vy
            )*
            0.65;

    }


    const GOAL_TOP=
        0.39;


    const GOAL_BOTTOM=
        0.61;


    /*
    ========================================================
        IZQUIERDA
    ========================================================
    */

    if(
        ball.x<=
        CONFIG.ballRadius
    ){

        if(

            ball.y>=
            GOAL_TOP &&

            ball.y<=
            GOAL_BOTTOM

        ){

            scoreGoal(
                ball.lastTeam
            );

            return;

        }


        ball.x=
            CONFIG.ballRadius;


        ball.vx=
            Math.abs(
                ball.vx
            )*
            0.65;

    }


    /*
    ========================================================
        DERECHA
    ========================================================
    */

    if(
        ball.x>=
        1-CONFIG.ballRadius
    ){

        if(

            ball.y>=
            GOAL_TOP &&

            ball.y<=
            GOAL_BOTTOM

        ){

            scoreGoal(
                ball.lastTeam
            );

            return;

        }


        ball.x=
            1-CONFIG.ballRadius;


        ball.vx=
            -Math.abs(
                ball.vx
            )*
            0.65;

    }


    /*
        Intercepción física.
    */

    checkBallInterceptions();


    /*
        Si sigue libre,
        buscamos responsable.
    */

    if(
        !ball.owner
    ){

        updateBallChaser();

    }


    const speed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    if(
        speed<
        0.018
    ){

        ball.vx=0;

        ball.vy=0;

        ball.flight=false;

        ball.state=
            "loose";


        updateBallChaser();

    }

}

/* ============================================================

   CM/CAM/CDM -> cualquier jugador activo como respaldo.
   ============================================================ */
function scoreGoal(
    team
){

    if(
        !team
    ){

        return;

    }


    log(

        "⚽ ¡GOL DE "+
        (
            team==="HOME"
            ? "LOCAL"
            : "VISITANTE"
        )+
        "!"

    );


    if(
        ball.owner
    ){

        ball.owner.hasBall=
            false;

    }


    ball.owner=null;

    ball.vx=0;

    ball.vy=0;

    ball.flight=false;

    ball.gkSaveAttempted=false;

    ball.state=
        "kickoff";

    ball.x=0.50;

    ball.y=0.50;

    ball.lastPasser=null;

    ball.passOriginX=0.50;

    ball.passOriginY=0.50;


    const restartTeam=
        team==="HOME"
        ? "AWAY"
        : "HOME";


    let restartPlayer=
        players.find(

            player =>

                player.team===
                restartTeam &&

                (
                    player.position==="CM" ||
                    player.position==="CAM" ||
                    player.position==="CDM"
                )

        );


    /*
       Respaldo: si no existe CM/CAM/CDM, cualquier jugador activo
       del equipo que recibió el gol puede realizar el saque.
       Así el balón nunca queda sin responsable después de un gol.
    */
    if(
        !restartPlayer
    ){

        restartPlayer=
            players.find(

                player =>

                    player.team===
                    restartTeam &&
                    player.active!==false

            );

    }

    if(
        restartPlayer
    ){

        restartPlayer.x=
            0.50;

        restartPlayer.y=
            0.50;


        restartPlayer.vx=0;

        restartPlayer.vy=0;


        giveBallTo(
            restartPlayer
        );


        log(

            "Saque de "+
            restartPlayer.name

        );

    }

}

function resolveOneVsOne(
    attacker,
    defender
){

    const attackerDRI=

        attacker.stats.DRI+

        randomStatModifier();


    const defenderDEF=

        defender.stats.DEF+

        randomStatModifier();


    log(

        "1v1: "+
        attacker.name+
        " DRI "+
        attackerDRI+
        " VS "+
        defender.name+
        " DEF "+
        defenderDEF

    );


    if(
        attackerDRI>
        defenderDEF
    ){

        log(

            attacker.name+
            " supera a "+
            defender.name

        );


        const target=
            chooseForwardTarget(
                attacker
            );


        attacker.targetX=
            target.x;


        attacker.targetY=
            target.y;


        return true;

    }


    giveBallTo(
        defender
    );


    log(

        defender.name+
        " recupera el balón."

    );


    return false;

}


/* =========================================================
   DUELOS
========================================================= */

function checkDuels(){

    if(
        !ball.owner
    ){

        return;

    }


    const attacker=
        ball.owner;


    /*
        Si el portero controla el balón,
        la posesión está protegida.
        Nadie inicia un 1v1 contra él.
    */
    if(
        attacker.position==="GK"
    ){

        return;

    }


    const defenders=
        opponentsOf(
            attacker
        )
        .filter(

            player =>
                player.position!==
                "GK"

        );


    /*
        El defensor principal
        es el único que puede
        iniciar inmediatamente
        el duelo.
    */

    const defender=
        defenders.find(

            player =>

                player.assignedAttacker===
                attacker

        );


    if(
        !defender
    ){

        return;

    }


    const d=
        distance(
            attacker,
            defender
        );


    if(
        d<
        CONFIG.tackleDistance
    ){

        if(
            attacker.state!==
            "dueling"
        ){

            attacker.state=
                "dueling";


            resolveOneVsOne(

                attacker,

                defender

            );


            if(
                ball.owner===
                attacker
            ){

                attacker.state=
                    "possession";

            }

        }

    }

}


/* =========================================================
   ELEGIR PASE
========================================================= */

function choosePassTarget(
    passer
){

    const teammates=
        teammatesOf(
            passer
        )
        .filter(

            player =>
                player.position!==
                "GK"

        );


    let best=null;

    let bestScore=
        -Infinity;


    const direction=
        attackDirection(
            passer
        );


    for(
        const teammate of teammates
    ){

        const d=
            distance(
                passer,
                teammate
            );


        if(
            d<
            0.06
        ){

            continue;

        }


        if(
            d>
            0.55
        ){

            continue;

        }


        let score=0;


        /*
            Avance.
        */

        score+=

            (
                teammate.x-
                passer.x
            )*
            direction*
            1.8;


        /*
            Distancia razonable.
        */

        score+=
            clamp(
                0.40-d,
                -0.20,
                0.40
            );


        /*
            Espacio.
        */

        for(
            const opponent of opponentsOf(
                passer
            )
        ){

            score+=
                clamp(

                    distance(
                        teammate,
                        opponent
                    ),

                    0,
                    0.18

                );

        }


        /*
            Evitar pasarle a alguien
            que esté completamente
            fuera de posición.
        */

        if(
            !isInsideNaturalZone(

                teammate,

                teammate.x,

                teammate.y

            )
        ){

            score-=0.08;

        }


        if(
            score>
            bestScore
        ){

            bestScore=
                score;

            best=
                teammate;

        }

    }


    return best;

}

========================================================= */

/* =========================================================
   PRESIÓN PROLONGADA + DUELOS REPETIDOS
========================================================= */
const supportPressureSince = new Map();
let repeatedDuelPair = null;
let repeatedDuelCount = 0;
let repeatedDuelLastTime = 0;
let supportBreakCooldown = 0;
function supportPlayerKey(player){return String(player.team)+":"+String(player.number ?? player.id ?? player.name);}
function updatePressureState(now){
    for(const player of players){
        if(ball.owner!==player){supportPressureSince.delete(supportPlayerKey(player));continue;}
        const opponent=opponentsOf(player).filter(o=>o.position!=="GK").sort((a,b)=>distance(player,a)-distance(player,b))[0];
        if(opponent && distance(player,opponent)<0.10){
            const key=supportPlayerKey(player);
            if(!supportPressureSince.has(key)) supportPressureSince.set(key,now);
        }else supportPressureSince.delete(supportPlayerKey(player));
    }
}
function isUnderLongPressure(player,now){const since=supportPressureSince.get(supportPlayerKey(player));return since!=null&&now-since>=3500;}
function registerRepeatedDuel(attacker,defender,now){
    const pair=[supportPlayerKey(attacker),supportPlayerKey(defender)].sort().join("|");
    if(repeatedDuelPair!==pair||now-repeatedDuelLastTime>2300){repeatedDuelPair=pair;repeatedDuelCount=1;}else repeatedDuelCount++;
    repeatedDuelLastTime=now;
}
function chooseSupportPlayer(team,excluded){
    const owner=ball.owner;if(!owner)return null;let best=null,bestScore=Infinity;
    for(const p of players){
        if(p.team!==team||p===excluded||p===owner||p.position==="GK")continue;
        if(p.state==="chasingBall"||p.state==="anticipating")continue;
        const d=distance(p,owner);if(d>0.24)continue;
        const base=getFormationAnchor(p);const displacement=distance(p,base);const score=d+displacement*0.55;
        if(score<bestScore){bestScore=score;best=p;}
    }return best;
}
function triggerDuelSupport(now){
    if(!ball.owner||repeatedDuelCount<10||now-repeatedDuelLastTime>3000||now<supportBreakCooldown)return;
    const owner=ball.owner;const opponentTeam=owner.team==="HOME"?"AWAY":"HOME";
    const defender=opponentsOf(owner).filter(p=>p.position!=="GK").sort((a,b)=>distance(owner,a)-distance(owner,b))[0];
    if(!defender||distance(owner,defender)>0.11)return;
    const ownSupport=chooseSupportPlayer(owner.team,owner);const defensiveSupport=chooseSupportPlayer(opponentTeam,defender);
    if(ownSupport){ownSupport.supportTargetX=owner.x;ownSupport.supportTargetY=owner.y;ownSupport.supportUntil=now+2800;ownSupport.supportMode="receive";}
    if(defensiveSupport){defensiveSupport.supportTargetX=owner.x;defensiveSupport.supportTargetY=owner.y;defensiveSupport.supportUntil=now+2800;defensiveSupport.supportMode="cover";}
    supportBreakCooldown=now+5000;repeatedDuelCount=0;
}

function chooseAction(
    player
){

    if(
        ball.owner!==player
    ){

        return;

    }

    const now=performance.now();

    /* Presión prolongada: liberar el balón mediante el sistema normal de pase. */
    if(isUnderLongPressure(player,now)){
        const forcedTarget=choosePassTarget(player);
        if(forcedTarget){
            passBall(player,forcedTarget);
            supportPressureSince.delete(supportPlayerKey(player));
            return;
        }
    }


    /*
        El portero tiene su propia IA:
        atrapar -> conservar -> distribuir.
    */
    if(
        player.position==="GK"
    ){

        return;

    }


    /*
        El portero no usa la lógica normal
        de avanzar/pasar/disparar.
        Su posesión se resuelve desde
        updateGoalkeeperPossession().
    */

    if(
        player.position==="GK"
    ){

        player.state=
            "goalkeeper";

        return;

    }


    player.state=
        "possession";


    const goalDistance=
        player.team==="HOME"
        ? 1-player.x
        : player.x;


    /*
    ========================================================
        TIRO
    ========================================================
    */

    if(

        goalDistance<
        0.22 &&

        player.stats.TEC>=5

    ){

        const angleToGoal=
            Math.abs(
                player.y-
                0.50
            );


        if(
            angleToGoal<
            0.22
        ){

            shootBall(
                player
            );

            return;

        }

    }


    /*
    ========================================================
        DEFENSOR PRINCIPAL
    ========================================================
    */

    const defender=
        opponentsOf(
            player
        )
        .filter(

            opponent =>
                opponent.position!==
                "GK"

        )
        .sort(

            (a,b)=>

                distance(
                    player,
                    a
                )-

                distance(
                    player,
                    b
                )

        )[0];


    if(
        defender
    ){

        const d=
            distance(
                player,
                defender
            );


        if(
            d<
            0.09
        ){

            registerRepeatedDuel(player,defender,performance.now());

            const attackerDRI=

                player.stats.DRI+
                randomStatModifier();


            const defenderDEF=

                defender.stats.DEF+
                randomStatModifier();


            if(
                attackerDRI>=
                defenderDEF
            ){

                resolveOneVsOne(

                    player,

                    defender

                );


                return;

            }


            const passTarget=
                choosePassTarget(
                    player
                );


            if(
                passTarget
            ){

                passBall(

                    player,

                    passTarget

                );

                return;

            }

        }

    }


    /*
    ========================================================
        PASE
    ========================================================
    */

    const passTarget=
        choosePassTarget(
            player
        );


    /*
        Si está relativamente seguro,
        puede pasar.

        No utilizamos una probabilidad
        fija para decidir éxito del pase;
        TEC ya determina el error físico.
    */

    if(
        passTarget
    ){

        const nearest=
            nearestOpponent(
                player
            );


        if(

            nearest.distance<
            0.14 ||

            player.position===
            "CM" ||

            player.position===
            "AM"

        ){

            passBall(

                player,

                passTarget

            );

            return;

        }

    }


    /*
    ========================================================
        AVANZAR
    ========================================================
    */

    const target=
        chooseForwardTarget(
            player
        );


    player.targetX=
        target.x;


    player.targetY=
        target.y;


    player.state=
        "carrying";

}


/* =========================================================
   IA GENERAL
========================================================= */

function updateAI(
    delta
){

    aiTimer+=delta;

    decisionTimer+=delta;

    const now=performance.now();
    updatePressureState(now);
    triggerDuelSupport(now);


    if(
        aiTimer>=
        CONFIG.aiInterval
    ){

        aiTimer=0;


        /*
            Apoyo ofensivo.
        */

        updateSupportAI(
            "HOME"
        );


        updateSupportAI(
            "AWAY"
        );


        /*
            Defensa.
        */

        if(
            ball.owner
        ){

            const attackingTeam=
                ball.owner.team;


            updateDefenseAI(
                attackingTeam
            );

        }


        /*
            Balón libre.
        */

        if(
            !ball.owner &&
            ball.flight
        ){

            updateBallChaser();

        }

    }


    /*
    ========================================================
        DECISIONES
    ========================================================
    */

    if(
        decisionTimer>=
        CONFIG.decisionInterval
    ){

        decisionTimer=0;


        if(
            ball.owner
        ){

            chooseAction(
                ball.owner
            );

        }

    }


    /*
    ========================================================
        MOVIMIENTO
    ========================================================
    */

    for(
        const player of players
    ){

        /*
            El jugador NO regresa
            automáticamente solo por
            salir de su zona.

            Primero comprobamos si
            todavía tiene una razón
            para estar ahí.
        */

        if(
            shouldReturnToFormation(
                player
            )
        ){

            /*
                Regreso progresivo.
            */

            player.targetX=
                lerp(

                    player.x,

                    player.baseX,

                    0.22

                );


            player.targetY=
                lerp(

                    player.y,

                    player.baseY,

                    0.22

                );

        }


        movePlayer(

            player,

            player.targetX,

            player.targetY,

            delta

        );

    }


    /*
        Duelos.
    */

    checkDuels();

}

========================================================= */

function resetMatch(){
    if(!players.length) return;
    for(const player of players){
        player.x=player.baseX;
        player.y=player.baseY;
        player.vx=0; player.vy=0;
        player.targetX=player.baseX;
        player.targetY=player.baseY;
        player.hasBall=false;
        player.state="formation";
        player.assignedAttacker=null;
        player.activeDuty=false;
        player.dutyTimer=0;
    }
    ball.owner=null; ball.flight=false;
    ball.vx=0; ball.vy=0;
    ball.x=0.50; ball.y=0.50;
    ball.state="kickoff";
    ball.lastTeam="HOME";
    ball.lastPasser=null;
    ball.passOriginX=0.50; ball.passOriginY=0.50;
    ball.gkSaveAttempted=false;
    const starter=players.find(p=>p.team==="HOME" && (p.position==="CM" || p.position==="AM" || p.position==="CDM")) || players.find(p=>p.team==="HOME");
    if(starter) giveBallTo(starter);
    running=false; aiTimer=0; decisionTimer=0; eventNumber=0; matchMinute=0;
    logElement.textContent="";
    log("PARTIDO REINICIADO.");
    if(starter) log("Saque inicial: "+starter.name);
    updateVisual();
    if(typeof actualizarMarcadorFisico==="function") actualizarMarcadorFisico();
    if(typeof actualizarEstadoFisico==="function") actualizarEstadoFisico();
}

function gameLoopPhysicsBase(
    timestamp
){

    if(
        !running
    ){

        lastTime=
            timestamp;


        requestAnimationFrame(
            gameLoop
        );


        return;

    }


    const delta=
        Math.min(

            0.035,

            (
                timestamp-
                lastTime
            )/1000

        );


    lastTime=
        timestamp;


    updateAI(
        delta
    );


    updateBall(
        delta
    );


    updateVisual();


    const ballSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    status.textContent=

        "BALÓN: "+
        ball.state+

        " | POSESIÓN: "+

        (

            ball.owner

            ?

            ball.owner.name+
            " ("+
            (
                ball.owner.team===
                "HOME"
                ? "LOCAL"
                : "VISITANTE"
            )+
            ")"

            :

            "LIBRE"

        )+

        " | POS: "+

        ball.x.toFixed(3)+
        ", "+
        ball.y.toFixed(3)+

        " | VEL: "+

        ballSpeed.toFixed(3);


    requestAnimationFrame(
        gameLoop
    );

}

function psdxAIKey(p){return String(p?.team??'')+':'+String(p?.id??p?.number??'');}
function psdxAID(a,b){return Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));}
function psdxAIWing(p){const q=Array.isArray(p?.position)?p.position:[p?.position||p?.pos||''];return q.includes('LW')||q.includes('RW');}

function psdxAIStats(p){const s=p?.stats||{};return{SPD:Number(s.SPD??p.SPD??0),POW:Number(s.POW??p.POW??0),DRI:Number(s.DRI??p.DRI??0),TEC:Number(s.TEC??p.TEC??0)};}
function psdxAIHasBall(p,b){return!!p&&(b?.owner===p||b?.ownerId===p.id||p.hasBall===true);}
function psdxAILineBlock(a,b,opps,r=27){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy;if(l<1)return null;let hit=null,bt=Infinity;for(const o of opps||[]){if(!o||o.active===false||o===a)continue;let t=((o.x-a.x)*vx+(o.y-a.y)*vy)/l;t=Math.max(0,Math.min(1,t));const px=a.x+vx*t,py=a.y+vy*t,d=Math.hypot(o.x-px,o.y-py);if(d<=r&&t<bt){hit=o;bt=t;}}return hit;}
function psdxAIPasses(p,team,opps){const out=[];for(const m of team?.players||[]){if(!m||m===p||m.active===false||m.isGK)continue;const d=psdxAID(m,p);if(d>340)continue;const blocked=!!psdxAILineBlock(p,m,opps);const bx=Number.isFinite(m.baseX)?m.baseX:m.x,by=Number.isFinite(m.baseY)?m.baseY:m.y,shape=Math.hypot(m.x-bx,m.y-by);out.push({player:m,d,blocked,score:d+(blocked?95:0)+shape*.25});}return out.sort((a,b)=>a.score-b.score);}

    function blocked(a,b,opps,r=30){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy;if(l<1)return null;let best=null,bt=Infinity;for(const o of opps||[]){if(!o||o.active===false)continue;let t=((o.x-a.x)*vx+(o.y-a.y)*vy)/l;t=Math.max(0,Math.min(1,t));const px=a.x+vx*t,py=a.y+vy*t,dd=Math.hypot(o.x-px,o.y-py);if(dd<=r&&t<bt){best=o;bt=t;}}return best;}
