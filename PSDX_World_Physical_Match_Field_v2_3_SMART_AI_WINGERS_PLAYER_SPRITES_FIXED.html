================================================== */

   ALINEACIONES
================================================== */

.tarjeta-equipo{

.jugador-nombre{

.jugador-posicion{

    border:3px solid #2E222F;

    padding:15px;

    display:flex;

    justify-content:center;

.cancha{

    height:420px;

    background:#4E704F;

    border:4px solid #FFF;

    position:relative;

    overflow:hidden;
}

.cancha::before{

    content:"";

    position:absolute;

    left:50%;

    top:0;

    width:4px;

    height:100%;

    background:#FFF;

    transform:translateX(-50%);
}

.circulo-central{

    position:absolute;

    left:50%;

    top:50%;

    width:110px;

    height:110px;

    border:4px solid #FFF;

    border-radius:50%;

    transform:translate(-50%,-50%);

.punto-central{

    position:absolute;

    left:50%;

    top:50%;

    width:7px;

    height:7px;

    background:#FFF;

    transform:translate(-50%,-50%);
}

.area-izquierda{

    position:absolute;

    left:-4px;

    top:105px;

    width:120px;

    height:210px;

    border:4px solid #FFF;

    border-left:none;
}

.area-derecha{

    position:absolute;

    right:-4px;

    top:105px;

    width:120px;

    height:210px;

    border:4px solid #FFF;

    border-right:none;
}

    position:absolute;

    width:30px;

    height:30px;

    background:#3E3546;

    border:2px solid #FFF;

    align-items:center;

    justify-content:center;

    width:12px;

    height:12px;

    background:#FFF;

    border:2px solid #2E222F;

    transform:translate(-50%,-50%);

/* ==================================================
   PHYSICAL MATCH FIELD — VISIBLE / XI SCALED
================================================== */
.cancha-contenedor{
    margin-top:15px;
    background:#514859;
    border:3px solid #2E222F;
    padding:15px;
    display:flex;
    justify-content:center;
    width:100%;
}
.cancha{
    width:min(950px,100%);
    height:auto;
    aspect-ratio:2 / 1;
    min-height:360px;
    background:#47704C;
    border:4px solid #FFF;
    position:relative;
    overflow:hidden;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.10);
}
.cancha::before{display:none;}
.cancha .area-izquierda,.cancha .area-derecha,.cancha .circulo-central,.cancha .punto-central{display:none;}
.psdx-field-line{position:absolute;pointer-events:none;z-index:1;}
.psdx-midline{left:50%;top:0;width:3px;height:100%;background:#FFF;transform:translateX(-50%);}
.psdx-center-circle{left:50%;top:50%;width:120px;height:120px;border:3px solid #FFF;border-radius:50%;transform:translate(-50%,-50%);}
.psdx-center-point{left:50%;top:50%;width:8px;height:8px;background:#FFF;border-radius:50%;transform:translate(-50%,-50%);}
.psdx-penalty{top:25%;width:15%;height:50%;border:3px solid #FFF;}
.psdx-penalty.left{left:-3px;border-left:0;}
.psdx-penalty.right{right:-3px;border-right:0;}
.psdx-goal{top:39%;width:4%;height:22%;border:3px solid #FFF;}
.psdx-goal.left{left:-4px;border-left:0;}
.psdx-goal.right{right:-4px;border-right:0;}
.psdx-box-left{left:-3px;top:33%;width:7%;height:34%;border:3px solid rgba(255,255,255,.85);border-left:0;}
.psdx-box-right{right:-3px;top:33%;width:7%;height:34%;border:3px solid rgba(255,255,255,.85);border-right:0;}
.psdx-six-left{left:-3px;top:42%;width:3%;height:16%;border:3px solid rgba(255,255,255,.85);border-left:0;}
.psdx-six-right{right:-3px;top:42%;width:3%;height:16%;border:3px solid rgba(255,255,255,.85);border-right:0;}
.player{
    position:absolute;width:32px;height:32px;
    transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;line-height:1;z-index:5;user-select:none;pointer-events:none;
}
.player.home,.player.away{background:transparent;border:0;box-shadow:none;}
.ball{position:absolute;width:12px;height:12px;border-radius:50%;background:#FFF;border:2px solid #222;transform:translate(-50%,-50%);z-index:10;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.4);}
@media(max-width:700px){
    .cancha{min-height:250px;}
    .player{width:32px;height:32px;font-size:9px;}
    .psdx-center-circle{width:85px;height:85px;}
}

<script>


/* ==================================================
   PSDX FONT
================================================== */

fetch("PSDX_Font1.fnt")

.then(response=>response.text())

.then(data=>{

const lineas=data.split("\n");

const imagenFont=new Image();

imagenFont.src="PSDX_Font1.png";

imagenFont.onload=()=>{

const ESCALA=.25;


/* ==================================================
   GLIFOS
================================================== */

function obtenerGlifos(texto){

const glifos={};

for(const caracter of texto){

if(glifos[caracter])
continue;

const id=
caracter.charCodeAt(0);

const linea=
lineas.find(
l=>l.startsWith(`char id=${id} `)
);

if(!linea)
continue;

const datos={};

const partes=
linea.match(
/(\w+)=([^\s]+)/g
);

if(!partes)
continue;

partes.forEach(parte=>{

const [clave,valor]=
parte.split("=");

datos[clave]=
Number(valor);

});

glifos[caracter]=
datos;

}

return glifos;

}


/* ==================================================
   CREAR TEXTO
================================================== */

function crearTexto(texto){

texto=
texto===undefined||
texto===null
?
""
:
String(texto);

const glifos=
obtenerGlifos(texto);

let anchoTotal=0;

let cursorCalculo=0;

for(const caracter of texto){

const datos=
glifos[caracter];

if(!datos)
continue;

const derecha=
cursorCalculo+
datos.xoffset+
datos.width;

if(derecha>anchoTotal)
anchoTotal=derecha;

cursorCalculo+=
datos.xadvance;

}

const canvas=
document.createElement("canvas");

canvas.width=
Math.max(
1,
Math.ceil(
anchoTotal*ESCALA
)
);

canvas.height=
Math.ceil(
112*ESCALA
);

const ctx=
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

let cursorX=0;

for(const caracter of texto){

const datos=
glifos[caracter];

if(!datos)
continue;

ctx.drawImage(

imagenFont,

datos.x,
datos.y,
datos.width,
datos.height,

cursorX+
datos.xoffset*ESCALA,

datos.yoffset*ESCALA,

datos.width*ESCALA,
datos.height*ESCALA

);

cursorX+=
datos.xadvance*ESCALA;

}

return canvas;

}

function buscarJugador(
lista,

){

if(!referencia)
return null;

if(typeof referencia==="string"){

return lista.find(
j=>
String(j.name).toLowerCase()===
referencia.toLowerCase()
);

}

const numero=
Number(
referencia.number ??
referencia.numero ??
-1
);

const nombre=
referencia.name ??
referencia.nombre ??
null;

if(nombre){

const encontrado=
lista.find(
j=>
String(j.name).toLowerCase()===
String(nombre).toLowerCase()
);

if(encontrado)
return encontrado;

}

if(numero>=0){

return lista.find(
j=>
Number(j.number)===numero
);

}

return null;

}

/* ==================================================
   EXTRAER COORDENADA REAL DEL XI
================================================== */

/*
   MUY IMPORTANTE:

   La coordenada del Team_XI tiene prioridad
   absoluta sobre la posición.

   Orden:

   1. coord
   2. coordinates
   3. position/pos con x,y
   4. x/y
   5. columna/fila
   6. grid
   7. fallback por posición

   Esto evita que jugadores que ocupan la misma
   posición terminen automáticamente en la misma
   coordenada.
*/

function obtenerCoordenadaXI(
entrada,
posicion
){

/* -----------------------------------------------
   coord: [x,y]
------------------------------------------------ */

if(
Array.isArray(
entrada.coord
)
&&
entrada.coord.length>=2
){

const x=
Number(
entrada.coord[0]
);

const y=
Number(
entrada.coord[1]
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   coord: "x,y"
------------------------------------------------ */

if(
typeof entrada.coord==="string"
){

const partes=
entrada.coord.split(",");

if(partes.length===2){

const x=
Number(partes[0]);

const y=
Number(partes[1]);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}

}


/* -----------------------------------------------
   coordinates: [x,y]
------------------------------------------------ */

if(
Array.isArray(
entrada.coordinates
)
&&
entrada.coordinates.length>=2
){

const x=
Number(
entrada.coordinates[0]
);

const y=
Number(
entrada.coordinates[1]
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   coordinates: {x,y}
------------------------------------------------ */

if(
entrada.coordinates &&
typeof entrada.coordinates==="object"
){

const x=
Number(
entrada.coordinates.x
);

const y=
Number(
entrada.coordinates.y
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   position / posicion con coordenadas
------------------------------------------------ */

const posicionDatos=
entrada.position &&
typeof entrada.position==="object"
?
entrada.position
:
(
entrada.posicion &&
typeof entrada.posicion==="object"
?
entrada.posicion
:
null
);

if(posicionDatos){

const x=
Number(
posicionDatos.x
);

const y=
Number(
posicionDatos.y
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   x / y directos
------------------------------------------------ */

if(
entrada.x!==undefined &&
entrada.y!==undefined
){

const x=
Number(entrada.x);

const y=
Number(entrada.y);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   columna / fila
------------------------------------------------ */

if(
entrada.columna!==undefined &&
entrada.fila!==undefined
){

const x=
Number(
entrada.columna
);

const y=
Number(
entrada.fila
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   column / row
------------------------------------------------ */

if(
entrada.column!==undefined &&
entrada.row!==undefined
){

const x=
Number(
entrada.column
);

const y=
Number(
entrada.row
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   grid: {x,y}
------------------------------------------------ */

if(
entrada.grid &&
typeof entrada.grid==="object"
){

const x=
Number(
entrada.grid.x ??
entrada.grid.columna ??
entrada.grid.column
);

const y=
Number(
entrada.grid.y ??
entrada.grid.fila ??
entrada.grid.row
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   FALLBACK
------------------------------------------------ */

return{

x:
posicionBase[posicion]?.[0]
??
4,

y:
posicionBase[posicion]?.[1]
??
3

};

}


/* ==================================================
   PUNTO NATURAL
================================================== */

function obtenerTipoPunto(
jugador,
posicion,
entrada
){

const valor=
entrada?.point ??
entrada?.dot ??
entrada?.punto ??
entrada?.estado ??
entrada?.status ??
null;

if(valor){

const texto=
String(valor).toLowerCase();

if(
texto==="red" ||
texto==="rojo"
)
return"rojo";

if(
texto==="yellow" ||
texto==="amarillo"
)
return"amarillo";

}

const naturales=
Array.isArray(
jugador.position
)
?
jugador.position
:
[];

if(
naturales.includes(posicion)
){

return"natural";

}

const cercanas={

GK:["GK"],

LB:["LB","RB","LM"],

CB:["CB","CDM"],

RB:["RB","LB","RM"],

LM:["LM","LW","CM"],

CDM:["CDM","CM","CB"],

CM:["CM","CDM","CAM","LM","RM"],

RM:["RM","RW","CM"],

CAM:["CAM","CM","ST","LW","RW"],

LW:["LW","RW","LM","CAM"],

RW:["RW","LW","RM","CAM"],

ST:["ST","CAM","LW","RW"]

};

if(
(cercanas[posicion]||[])
.some(
p=>naturales.includes(p)
)
){

return"amarillo";

}

return"rojo";

}


/* ==================================================
   MODIFICADOR
================================================== */

function modificadorPunto(
tipo
){

if(tipo==="rojo")
return-2;

if(tipo==="amarillo")
return-1;

return 0;

}


/* ==================================================
   STATS
================================================== */

function prepararStats(
jugador,
tipo
){

const stats={
...jugador.stats
};

const modificador=
modificadorPunto(tipo);

for(const stat in stats){

if(stat==="STA")
continue;

stats[stat]=
Math.max(
0,
Math.min(
10,
Math.round(
stats[stat]+
modificador
)
)
);

}

return stats;

}

/* ==================================================
   CREAR XI
================================================== */

function extraerEntradasXI(
datos
){

if(Array.isArray(datos))
return datos;

if(Array.isArray(datos.players))
return datos.players;

if(Array.isArray(datos.playersXI))
return datos.playersXI;

if(Array.isArray(datos.xi))
return datos.xi;

if(Array.isArray(datos.startingXI))
return datos.startingXI;

if(Array.isArray(datos.once))
return datos.once;

if(Array.isArray(datos.lineup))
return datos.lineup;

if(datos.players){

return Object.values(
datos.players
);

}

return[];

}


function construirXI(
codigo,
datosXI,
jugadores
){

const entradas=
extraerEntradasXI(
datosXI
);

const resultado=[];

for(const entrada of entradas){

const referencia=
entrada.player ??
entrada.jugador ??
entrada;

const jugadorBase=
buscarJugador(
jugadores,
referencia
);

if(!jugadorBase){

debug(
`No se encontró jugador para una entrada del XI de ${codigo}`,
"result"
);

continue;

}

const jugador=
normalizarJugador(
jugadorBase
);

const posicion=
String(
entrada.position ??
entrada.posicion ??
entrada.role ??
jugador.position?.[0] ??
"CM"
).toUpperCase();


/*
   LA COORDENADA VIENE DEL XI.

   NO SE CALCULA A PARTIR DE LA POSICIÓN
   SI EL XI YA TIENE UNA COORDENADA.
*/

let coord=
obtenerCoordenadaXI(
entrada,
posicion
);

coord=
coordenadaValida(
coord
);


/*
   El visitante se visualiza invertido,
   pero la coordenada original del XI
   sigue siendo respetada.

   Guardamos ambas.
*/

const coordXI={
...coord
};

if(codigo===codigoVisitante){

coord=
invertirCoordenada(
coord
);

}


const tipoPunto=
obtenerTipoPunto(
jugador,
posicion,
entrada
);

const stats=
prepararStats(
jugador,
tipoPunto
);

resultado.push({

...jugador,

equipo:codigo,

nombre:jugador.name,

posicion,

coord,

coordXI,

coordInicial:{
...coord
},

punto:tipoPunto,

statsOriginales:{
...jugador.stats
},

stats,

activo:true

});

}

return resultado;

}

);

    PHYSICAL MATCH ENGINE

    IA DE POSICIONAMIENTO v2

    PRINCIPIOS:

    1. Cada jugador tiene una posición natural.
    2. Esa posición funciona como centro de referencia.
    3. Los jugadores pueden abandonar temporalmente su zona.
    4. Solo jugadores con responsabilidad real persiguen.
    5. Los defensores se distribuyen.
    6. El balón libre se analiza mediante trayectoria.
    7. Los jugadores pueden anticipar pases.
    8. El regreso a la posición es progresivo.
    9. El portador decide entre avanzar, pasar y disparar.
   10. Los duelos utilizan variación ±1.

================================================================
*/

/* =========================================================
   UTILIDADES
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function lerp(
    a,
    b,
    amount
){

    return a+
        (b-a)*
        amount;

}


function distance(
    a,
    b
){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function normalize(
    x,
    y
){

    const length=
        Math.hypot(
            x,
            y
        )||1;


    return{

        x:x/length,

        y:y/length

    };

}


function rotate(
    vector,
    angle
){

    const cos=
        Math.cos(angle);

    const sin=
        Math.sin(angle);


    return{

        x:
            vector.x*cos-
            vector.y*sin,

        y:
            vector.x*sin+
            vector.y*cos

    };

}


/*
    Variación pequeña.

    NO determina automáticamente
    quién gana.

    Solo evita que el mismo
    enfrentamiento produzca
    siempre el mismo resultado.
*/

function randomStatModifier(){

    return Math.floor(
        Math.random()*3
    )-1;

}


/* =========================================================
   MODIFICADORES DE POSICIÓN
========================================================= */

function applyPositionModifier(
    stats,
    marker
){

    let factor=1;


    if(
        marker==="yellow"
    ){

        factor=0.90;

    }


    if(
        marker==="red"
    ){

        factor=0.78;

    }


    const result={};


    for(
        const stat of Object.keys(stats)
    ){

        result[stat]=clamp(

            Math.round(
                stats[stat]*factor
            ),

            0,
            10

        );

    }


    return result;

}

   ZONAS NATURALES
========================================================= */

function getRoleWidth(
    position
){

    switch(position){

        case "GK":
            return 0.07;

        case "LB":
        case "RB":
            return 0.115;

        case "CB":
            return 0.14;

        case "CM":
            return 0.19;

        case "LW":
        case "RW":
            return 0.14;

        case "AM":
            return 0.19;

        case "ST":
            return 0.17;

        default:
            return 0.17;

    }

}


function getRoleDepth(
    position
){

    switch(position){

        case "GK":
            return 0.045;

        case "CB":
            return 0.105;

        case "LB":
        case "RB":
            return 0.15;

        case "CM":
            return 0.19;

        case "LW":
        case "RW":
            return 0.19;

        case "AM":
            return 0.21;

        case "ST":
            return 0.19;

        default:
            return 0.18;

    }

}


/* =========================================================
   CREAR JUGADOR
========================================================= */

function createPlayer(
    data,
    team,
    alreadyPhysical=false
){

    const [

        position,
        x,
        y,
        name,

        SPD,
        POW,
        STA,
        DRI,
        DEF,
        TEC,
        KEP,

        marker

    ]=data;


    const stats=
        applyPositionModifier(

            {
                SPD,
                POW,
                STA,
                DRI,
                DEF,
                TEC,
                KEP
            },

            marker

        );


    const physicalX=
        alreadyPhysical
        ? x
        : (team==="HOME" ? x : 1-x);


    return{

        id:
            crypto.randomUUID(),

        team,

        position,

        name,

        marker,

        stats,

        baseX:physicalX,

        baseY:y,

        x:physicalX,

        y,

        vx:0,

        vy:0,

        targetX:physicalX,

        targetY:y,

        roleWidth:
            getRoleWidth(
                position
            ),

        roleDepth:
            getRoleDepth(
                position
            ),

        hasBall:false,

        state:"formation",

        element:null,

        /*
            Defensa:

            quién está siendo
            marcado actualmente.
        */

        assignedAttacker:null,

        /*
            Si está participando
            activamente en una jugada.
        */

        activeDuty:false,

        /*
            Tiempo desde que tomó
            una responsabilidad defensiva.
        */

        dutyTimer:0

    };

}

/* =========================================================
   CREAR JUGADORES DESDE TEAM_XI
========================================================= */

// Team_XI utiliza una grid de 9 columnas x 7 filas: x=0..8, y=0..6.
// El motor puede usar cualquier tamaño visual; estas funciones escalan el XI
// al rectángulo físico 0..1 de la cancha.
const XI_GRID_COLS=9;
const XI_GRID_ROWS=7;
function xiToFieldX(x){
    return clamp(Number(x)/(XI_GRID_COLS-1),0.035,0.965);
}
function xiToFieldY(y){
    return clamp(Number(y)/(XI_GRID_ROWS-1),0.045,0.955);
}

function initializePhysicsPlayers(){
    players=[];
    const local=obtenerLocal();
    const visitante=obtenerVisitante();
    const sourceTeams=[
        {team:"HOME",data:local.once},
        {team:"AWAY",data:visitante.once}
    ];
    for(const source of sourceTeams){
        for(const jugador of source.data){
            const x=xiToFieldX(jugador.coord.x);
            const y=xiToFieldY(jugador.coord.y);
            const data=[
                jugador.posicion,x,y,jugador.nombre,
                jugador.stats.SPD,jugador.stats.POW,jugador.stats.STA,
                jugador.stats.DRI,jugador.stats.DEF,jugador.stats.TEC,
                jugador.stats.KEP,"green"
            ];
            const physical=createPlayer(data,source.team,true);
            physical.stats={...jugador.stats};
            physical.marker=jugador.punto;
            physical.number=jugador.number;
            physical.baseXI={x:jugador.coordXI.x,y:jugador.coordXI.y};
            players.push(physical);
        }
    }
    createVisuals();
    updateVisual();
}

/* ============================================================
   PSDX V2.3 — PLAYER SPRITES / TEAM COLORS — FIXED
   Solo visual: no altera física, IA, reglas ni estadísticas.
   Assets:
     PLAYER/FILL.png
     PLAYER/OUTLINE.png
     COLORS/<country>.json
   ============================================================ */
const PSDX_PLAYER_SPRITE_SIZE=32;
const PSDX_PLAYER_ASSET_SIZE=800;
const PSDX_PLAYER_DRAW_SIZE=32;

const psdxSpriteImages={fill:null,outline:null};
const psdxTeamColors={HOME:null,VISITOR:null};
let psdxSpritesReady=false;

function psdxNormalizeColorName(v){
    return String(v??"").trim().toUpperCase();
}
function psdxNormalizeHex(v,fallback){
    const s=String(v??"").trim();
    return /^#[0-9A-Fa-f]{6}$/.test(s)?s:(fallback||"#FFFFFF");
}
function psdxColorObject(obj,fallback){
    if(!obj || typeof obj!=="object") return {hex:fallback,name:"UNKNOWN"};
    return {
        hex:psdxNormalizeHex(obj.hex??obj.color??obj.code,fallback),
        name:psdxNormalizeColorName(obj.name??obj.color??obj.colorName??obj.type)
    };
}
async function psdxLoadImage(path){
    return new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error("No se pudo cargar "+path));
        img.src=path;
    });
}
async function psdxLoadTeamColors(){
    try{
        const codes=[codigoLocal,codigoVisitante];
        const data={};
        for(const code of codes){
            const response=await fetch(`COLORS/${code}.json`,{cache:"no-store"});
            if(!response.ok) throw new Error(`COLORS/${code}.json HTTP ${response.status}`);
            data[code]=await response.json();
        }

        const local=data[codigoLocal]||{};
        const visitor=data[codigoVisitante]||{};
        const homeRaw=local.HOME||local.home||{};
        const localVisitorRaw=local.VISITOR||local.visitor||{};
        const visitorHomeRaw=visitor.HOME||visitor.home||{};
        const visitorVisitorRaw=visitor.VISITOR||visitor.visitor||{};

        const home=psdxColorObject(homeRaw,"#25805A");
        let away=psdxColorObject(visitorVisitorRaw,"#4389B7");

        /* If the visitor's textual color is the same as HOME,
           use the visitor country's HOME kit instead. */
        if(away.name && home.name && away.name===home.name){
            away=psdxColorObject(visitorHomeRaw,away.hex);
        }

        /* If still identical, use local VISITOR as a final visual fallback. */
        if(away.name && home.name && away.name===home.name){
            const alt=psdxColorObject(localVisitorRaw,away.hex);
            if(alt.name!==home.name) away=alt;
        }

        psdxTeamColors.HOME=home;
        psdxTeamColors.VISITOR=away;

        if(psdxSpritesReady && Array.isArray(players)){
            for(const player of players){
                drawPlayerSprite(player);
            }
        }
    }catch(error){
        console.warn("PSDX V2.3: no se pudieron cargar COLORS/*.json; usando colores de respaldo.",error);
        psdxTeamColors.HOME={hex:"#25805A",name:"GREEN"};
        psdxTeamColors.VISITOR={hex:"#4389B7",name:"BLUE"};
    }
}
async function psdxPrepareSpriteAssets(){
    try{
        const [fill,outline]=await Promise.all([
            psdxLoadImage("VISUAL_PLAYER/FILL.png"),
            psdxLoadImage("VISUAL_PLAYER/OUTLINE.png")
        ]);
        psdxSpriteImages.fill=fill;
        psdxSpriteImages.outline=outline;
        psdxSpritesReady=true;

        if(Array.isArray(players)){
            for(const player of players){
                drawPlayerSprite(player);
            }
        }
    }catch(error){
        console.warn(
            "PSDX V2.3: no se pudieron cargar VISUAL_VISUAL_PLAYER/FILL.png u OUTLINE.png.",
            error
        );
        psdxSpritesReady=false;
    }
}
function psdxHexRGB(hex){
    const h=String(hex||"").replace("#","");
    if(!/^[0-9A-Fa-f]{6}$/.test(h)) return [255,255,255];
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function drawPlayerSprite(player){
    if(!player?.element) return;
    const canvas=player.element.querySelector(".psdx-player-sprite");
    if(!canvas || !psdxSpritesReady) return;
    const ctx=canvas.getContext("2d");
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled=false;

    const teamColor=player.team==="HOME"?psdxTeamColors.HOME:psdxTeamColors.VISITOR;
    const [r,g,b]=psdxHexRGB(teamColor?.hex||"#FFFFFF");

    /* Draw the 800x800 pixel-art fill at exactly 32x32, then recolor
       its non-transparent pixels. The transparent outline layer is
       drawn afterward so it provides the intended shadow/edge effect. */
    const tmp=document.createElement("canvas");
    tmp.width=PSDX_PLAYER_DRAW_SIZE;
    tmp.height=PSDX_PLAYER_DRAW_SIZE;
    const t=tmp.getContext("2d");
    t.imageSmoothingEnabled=false;
    t.clearRect(0,0,tmp.width,tmp.height);
    t.drawImage(psdxSpriteImages.fill,0,0,PSDX_PLAYER_ASSET_SIZE,PSDX_PLAYER_ASSET_SIZE,0,0,PSDX_PLAYER_DRAW_SIZE,PSDX_PLAYER_DRAW_SIZE);
    const pixels=t.getImageData(0,0,tmp.width,tmp.height);
    for(let i=0;i<pixels.data.length;i+=4){
        if(pixels.data[i+3]>0){
            pixels.data[i]=r;
            pixels.data[i+1]=g;
            pixels.data[i+2]=b;
        }
    }
    t.putImageData(pixels,0,0);
    ctx.drawImage(tmp,0,0);
    ctx.drawImage(psdxSpriteImages.outline,0,0,PSDX_PLAYER_ASSET_SIZE,PSDX_PLAYER_ASSET_SIZE,0,0,PSDX_PLAYER_DRAW_SIZE,PSDX_PLAYER_DRAW_SIZE);
}

function getPlayerMaxSpeed(
    player
){

    return (

        0.045+

        player.stats.SPD*

    );

}


/* =========================================================
   MOVIMIENTO FÍSICO
========================================================= */

function movePlayer(
    player,
    targetX,
    targetY,
    delta
){

    const dx=
        targetX-player.x;

    const dy=
        targetY-player.y;


    const d=
        Math.hypot(
            dx,
            dy
        );


    if(
        d<
        0.004
    ){

        player.vx*=
            Math.max(
                0,
                1-
                CONFIG.braking*
                delta
            );


        player.vy*=
            Math.max(
                0,
                1-
                CONFIG.braking*
                delta
            );


        player.x+=
            player.vx*
            delta;


        player.y+=
            player.vy*
            delta;


        return;

    }


    const direction=
        normalize(
            dx,
            dy
        );


    const acceleration=

        CONFIG.acceleration*
        (
            0.55+
            player.stats.STA*
            0.055
        );


    player.vx+=
        direction.x*
        acceleration*
        delta;


    player.vy+=
        direction.y*
        acceleration*
        delta;


    const speed=
        Math.hypot(
            player.vx,
            player.vy
        );


    const maxSpeed=
        getPlayerMaxSpeed(
            player
        );


    if(
        speed>
        maxSpeed
    ){

        player.vx=
            player.vx/
            speed*
            maxSpeed;


        player.vy=
            player.vy/
            speed*
            maxSpeed;

    }


    player.x+=
        player.vx*
        delta;


    player.y+=
        player.vy*
        delta;


    player.x=
        clamp(
            player.x,
            CONFIG.playerRadius,
            1-CONFIG.playerRadius
        );


    player.y=
        clamp(
            player.y,
            CONFIG.playerRadius,
            1-CONFIG.playerRadius
        );

}
