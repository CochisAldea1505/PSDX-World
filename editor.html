<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PSDX Player Editor</title>

<style>
body{
    background:#3E3546;
    margin:0;
    padding:40px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    font-family:Arial,sans-serif;
}
.panel{
    width:1000px;
    background:#694F62;
    border:4px solid #2E222F;
    box-shadow:6px 6px 0 #2E222F;
    padding:20px;
    box-sizing:border-box;
}
.titulo{
    height:50px;
    background:#3E3546;
    border:3px solid #2E222F;
    padding:5px;
    box-sizing:border-box;
}
.contenido-principal{
    margin-top:20px;
    display:flex;
    gap:20px;
    align-items:flex-start;
}
.contenido{
    width:520px;
    background:#514859;
    border:3px solid #2E222F;
    padding:15px;
    box-sizing:border-box;
    position:relative;
}

/* BANDERAS */
.selector-bandera{
    position:relative;
    width:250px;
    margin-bottom:12px;
    z-index:10;
}
.selector-actual{
    width:100%;
    height:38px;
    background:#3E3546;
    border:3px solid #2E222F;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    cursor:pointer;
    padding:3px;
    position:relative;
}
.selector-actual:hover{background:#453B4C}
.selector-bandera-img{
    width:30px;
    height:23px;
    object-fit:fill;
    image-rendering:pixelated;
    margin-right:8px;
}
.selector-texto{
    display:flex;
    align-items:center;
    height:100%;
}
.selector-flecha{
    position:absolute;
    right:8px;
    top:6px;
    color:#B59B4A;
    font-size:18px;
    pointer-events:none;
}
.lista-bandera{
    display:none;
    position:absolute;
    left:0;
    top:41px;
    width:100%;
    max-height:300px;
    overflow-y:auto;
    background:#3E3546;
    border:3px solid #2E222F;
    box-sizing:border-box;
    box-shadow:5px 5px 0 #2E222F;
}
.lista-bandera.abierta{display:block}
.opcion-bandera{
    height:42px;
    background:#3E3546;
    border-bottom:2px solid #2E222F;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    padding:4px;
    cursor:pointer;
}
.opcion-bandera:last-child{border-bottom:none}
.opcion-bandera:hover{background:#694F62}
.opcion-bandera.seleccionada{background:#514859}
.opcion-img{
    width:38px;
    height:30px;
    object-fit:fill;
    image-rendering:pixelated;
    margin-right:8px;
}
.opcion-texto{display:flex;align-items:center}
.lista-bandera::-webkit-scrollbar{width:10px}
.lista-bandera::-webkit-scrollbar-track{background:#2E222F}
.lista-bandera::-webkit-scrollbar-thumb{
    background:#694F62;
    border:2px solid #2E222F;
}

/* BANDERA GRANDE */
#banderaCanvas{
    display:block;
    image-rendering:pixelated;
    margin-bottom:10px;
}

/* NOMBRE */
.editor-nombre{
    position:relative;
    min-height:30px;
}
#nombreInput{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:35px;
    opacity:0;
    cursor:text;
    z-index:2;
    border:none;
    outline:none;
}
#nombreCanvas{
    position:relative;
    z-index:1;
    pointer-events:none;
}

/* POSICIÓN */
.editor-posicion{
    margin-top:15px;
    display:flex;
    align-items:center;
    gap:10px;
}
.boton-posicion{
    height:40px;
    min-width:120px;
    background:#3E3546;
    border:3px solid #2E222F;
    box-shadow:3px 3px 0 #2E222F;
    cursor:pointer;
    padding:4px 8px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.boton-posicion:hover{background:#453B4C}
#posicionActual{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* JUGADOR */
.editor-jugador{
    width:420px;
    background:#514859;
    border:3px solid #2E222F;
    padding:15px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
}
.jugador-titulo{
    width:100%;
    height:40px;
    background:#3E3546;
    border:3px solid #2E222F;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    padding-left:8px;
    margin-bottom:15px;
}
.jugador-zona{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:15px;
}
.jugador-preview{
    width:180px;
    height:324px;
    background:#3E3546;
    border:3px solid #2E222F;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    image-rendering:pixelated;
}
#jugadorCanvas{
    width:160px;
    height:288px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}
.colores-jugador{
    width:180px;
    display:flex;
    flex-direction:column;
    gap:7px;
}
.color-control{
    height:38px;
    background:#3E3546;
    border:2px solid #2E222F;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 6px;
}
.color-nombre{
    display:flex;
    align-items:center;
    height:100%;
    pointer-events:none;
}
.color-control input[type="color"]{
    width:35px;
    height:27px;
    padding:0;
    border:2px solid #2E222F;
    background:transparent;
    cursor:pointer;
}

/* STATS */
.stats{
    margin-top:20px;
    background:#514859;
    border:3px solid #2E222F;
    padding:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}
.stat{
    height:65px;
    background:#3E3546;
    border:2px solid #2E222F;
    padding:5px;
    box-sizing:border-box;
    position:relative;
    cursor:text;
}
.stat canvas{display:block;pointer-events:none}
.stat input{
    position:absolute;
    left:5px;
    top:5px;
    width:100px;
    height:25px;
    opacity:0;
    z-index:5;
    cursor:text;
    border:none;
    outline:none;
}
.stat-buttons{
    position:absolute;
    right:5px;
    top:5px;
    display:flex;
    flex-direction:column;
    gap:2px;
    z-index:8;
}
.stat-button{
    width:20px;
    height:13px;
    padding:0;
    border:2px solid #2E222F;
    background:#694F62;
    color:#E3D8E1;

    line-height:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-sizing:border-box;
}
.stat-button:hover{background:#806176}
.stat-button:active{background:#514859}
.barra{

    gap:2px;

    height:10px;
}
.bloque{

    height:10px;

}
canvas{

}

}
.jugadores-titulo{

    border:2px solid #2E222F;
    display:flex;
    align-items:center;

.lista-jugadores{

    flex-direction:column;

    max-height:220px;

.jugador-guardado.seleccionado{background:#806176}
.jugador-guardado-info{

}
.jugador-guardado-nombre,

    align-items:center;

.jugador-guardado-pais,

    width:28px;
    height:28px;
    background:#694F62;
    border:2px solid #2E222F;
    color:#E8E1E8;

.boton-eliminar-jugador:hover{background:#B85C5C}
.botones-jugadores{
    margin-top:8px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
}
.boton-jugador{
    height:38px;
    background:#3E3546;
    border:3px solid #2E222F;

    align-items:center;
    justify-content:center;

.boton-jugador:active{

}

.cancha-contenedor{
    margin-top:15px;
    display:flex;
    justify-content:center;
}
.cancha{
    width:440px;
    height:300px;
    background:#4E704F;
    border:4px solid #FFF;
    box-sizing:border-box;
    position:relative;
}
.cancha::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:4px;
    height:100%;
    background:#FFF;
    transform:translateX(-50%);
}
.circulo-central{
    position:absolute;
    left:50%;
    top:50%;
    width:80px;
    height:80px;
    border:4px solid #FFF;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-sizing:border-box;
}
.punto-central{
    position:absolute;
    left:50%;
    top:50%;
    width:6px;
    height:6px;
    background:#FFF;
    transform:translate(-50%,-50%);
}
.area-izquierda{
    position:absolute;
    left:-4px;
    top:75px;
    width:70px;
    height:142px;
    border:4px solid #FFF;
    border-left:none;
    box-sizing:border-box;
}
.area-derecha{
    position:absolute;
    right:-4px;
    top:75px;
    width:70px;
    height:142px;
    border:4px solid #FFF;
    border-right:none;
    box-sizing:border-box;
}
.punto-posicion{
    position:absolute;
    width:38px;
    height:38px;
    background:#3E3546;
    border:3px solid #FFF;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;

.punto-posicion:hover{
    background:#694F62;

}
.punto-posicion.seleccionado{
    background:#B59B4A;

}
.pos-gk{left:10px;top:131px}

</style>

<script>

fetch("PSDX_Font1.fnt")
.then(response=>response.text())
.then(data=>{

const lineas=data.split("\n");
const imagen=new Image();
imagen.src="PSDX_Font1.png";

imagen.onload=()=>{

const ESCALA=.25;

function obtenerGlifos(texto){
const glifos={};

for(const caracter of texto){

if(glifos[caracter])continue;

const id=caracter.charCodeAt(0);

const linea=lineas.find(l=>l.startsWith(`char id=${id} `));

if(!linea)continue;

const datos={};

linea.match(/(\w+)=([^\s]+)/g).forEach(parte=>{
const [clave,valor]=parte.split("=");
datos[clave]=Number(valor);
});

glifos[caracter]=datos;
}

return glifos;
}

function crearTexto(texto){

const glifos=obtenerGlifos(texto);
let anchoTotal=0;
let cursorCalculo=0;

for(const caracter of texto){

const datos=glifos[caracter];
if(!datos)continue;

const derecha=cursorCalculo+datos.xoffset+datos.width;

if(derecha>anchoTotal)anchoTotal=derecha;

cursorCalculo+=datos.xadvance;
}

const canvas=document.createElement("canvas");

canvas.width=Math.max(1,anchoTotal*ESCALA);
canvas.height=112*ESCALA;

const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

let cursorX=0;

for(const caracter of texto){

const datos=glifos[caracter];
if(!datos)continue;

ctx.drawImage(
imagen,
datos.x,datos.y,datos.width,datos.height,
cursorX+datos.xoffset*ESCALA,
datos.yoffset*ESCALA,
datos.width*ESCALA,
datos.height*ESCALA
);

cursorX+=datos.xadvance*ESCALA;
}

return canvas;
}

/* ==================================================
   ETIQUETAS
================================================== */

document.querySelectorAll(".color-nombre").forEach(e=>{
e.innerHTML="";
e.appendChild(crearTexto(e.dataset.texto));
});

/* ==================================================
   PAÍSES
================================================== */

const paises=[
["ALG"],["ARG"],["AUS"],["AUT"],["BEL"],["BIH"],["BRA"],

const RECORTE_X=88;

function crearMiniaturaBandera(archivo){

const canvas=document.createElement("canvas");
canvas.width=38;
canvas.height=30;
canvas.className="opcion-img";

const img=new Image();
img.src="FLAGS PSDX/"+archivo;

img.onload=()=>{
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

ctx.drawImage(
img,
RECORTE_X,RECORTE_Y,
RECORTE_ANCHO,RECORTE_ALTO,
0,0,38,30
);
};

return canvas;
}

function crearOpcionPais(pais){

const opcion=document.createElement("div");
opcion.className="opcion-bandera";

if(pais.nombre===paisActual)
opcion.classList.add("seleccionada");

opcion.appendChild(crearMiniaturaBandera(pais.archivo));

const texto=document.createElement("div");
texto.className="opcion-texto";
texto.appendChild(crearTexto(pais.nombre));

opcion.appendChild(texto);

opcion.addEventListener("click",()=>seleccionarPais(pais));

listaBandera.appendChild(opcion);
}

function seleccionarPais(pais){

paisActual=pais.nombre;

selectorImagen.src="FLAGS PSDX/"+pais.archivo;

selectorTexto.innerHTML="";
selectorTexto.appendChild(crearTexto(pais.nombre));

listaBandera.innerHTML="";
paises.forEach(crearOpcionPais);

listaBandera.classList.remove("abierta");

cargarBanderaGrande(pais.archivo);
}

paises.forEach(crearOpcionPais);

selectorActual.addEventListener("click",e=>{
e.stopPropagation();
listaBandera.classList.toggle("abierta");
});

document.addEventListener("click",e=>{
if(!selectorBandera.contains(e.target))
listaBandera.classList.remove("abierta");
});

function cargarBanderaGrande(archivo){

const bandera=new Image();

bandera.src="FLAGS PSDX/"+archivo;

bandera.onload=()=>{

const canvas=document.getElementById("banderaCanvas");

canvas.width=RECORTE_ANCHO*ESCALA_BANDERA;
canvas.height=RECORTE_ALTO*ESCALA_BANDERA;

const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.drawImage(
bandera,
RECORTE_X,RECORTE_Y,
RECORTE_ANCHO,RECORTE_ALTO,
0,0,
RECORTE_ANCHO*ESCALA_BANDERA,
RECORTE_ALTO*ESCALA_BANDERA
);
};
}

const jugadorCanvas=document.getElementById("jugadorCanvas");

const jugadorCapas=[

{id:"hair_color1",archivo:"hair_color1.png"},
{id:"skin_color1",archivo:"skin_color1.png"},

{id:"player_base",archivo:"player_base.png"}
];

const imagenesJugador={};

function cargarImagenJugador(capa){

return new Promise((resolve,reject)=>{

const img=new Image();

img.onload=()=>{
imagenesJugador[capa.id]=img;
resolve();
};

img.onerror=()=>{
console.error("NO SE PUDO CARGAR:","player/"+capa.archivo);
reject(capa.archivo);
};

img.src="player/"+capa.archivo;
});
}

function obtenerIdColor(id){

return{
shirt_color1:"shirtColor1",
shirt_color2:"shirtColor2",
hair_color1:"hairColor1",
skin_color1:"skinColor1",
logo_color1:"logoColor1",
shorts_color1:"shortsColor1"
}[id];
}

function colorearCapa(imagen,color){

const canvas=document.createElement("canvas");
canvas.width=20;
canvas.height=36;

const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

ctx.drawImage(imagen,0,0,20,36);

ctx.globalCompositeOperation="source-in";
ctx.fillStyle=color;
ctx.fillRect(0,0,20,36);
ctx.globalCompositeOperation="source-over";

return canvas;
}

function dibujarJugador(){

jugadorCtx.clearRect(
0,0,
jugadorCanvas.width,
jugadorCanvas.height
);

for(const capa of jugadorCapas){

if(capa.id==="player_base")continue;

const imagen=imagenesJugador[capa.id];
if(!imagen)continue;

const control=document.getElementById(
obtenerIdColor(capa.id)
);

if(!control)continue;

jugadorCtx.drawImage(
colorearCapa(imagen,control.value),
0,0
);
}

const base=imagenesJugador.player_base;

if(base)
jugadorCtx.drawImage(base,0,0,20,36);
}

Promise.all(jugadorCapas.map(cargarImagenJugador))
.then(()=>{

document.querySelectorAll(
'.color-control input[type="color"]'
).forEach(input=>{
input.addEventListener("input",dibujarJugador);
});

dibujarJugador();
});

document.querySelectorAll(".stat").forEach(stat=>{

function crearBarra(valor){

const barra=document.createElement("div");
barra.className="barra";

let color=null;

if(valor>=8)color="#6FAF5F";
else if(valor>=5)color="#B59B4A";
else if(valor>=1)color="#B85C5C";

for(let i=0;i<10;i++){

const bloque=document.createElement("div");
bloque.className="bloque";

if(i<valor)
bloque.style.background=color;

barra.appendChild(bloque);
}

return barra;
}

function actualizarStat(){

let valor=Number(input.value);

if(isNaN(valor))valor=0;

valor=Math.max(0,Math.min(10,valor));
input.value=valor;

contenedor.innerHTML="";

contenedor.appendChild(
crearTexto(nombres[id]+" "+valor)
);

contenedor.appendChild(
crearBarra(valor)
);
}

input.addEventListener("input",actualizarStat);

stat.addEventListener("click",e=>{
if(!e.target.classList.contains("stat-button"))
input.focus();
});

stat.querySelector(".subir").addEventListener("click",e=>{

e.stopPropagation();

let valor=Number(input.value);

if(valor<10)valor++;

input.value=valor;
actualizarStat();
});

stat.querySelector(".bajar").addEventListener("click",e=>{

e.stopPropagation();

let valor=Number(input.value);

if(valor>0)valor--;

input.value=valor;
actualizarStat();
});

});

const listaJugadores=

const mensajeJugadores=

let jugadoresGuardados=

)||[];

let jugadorSeleccionado=null;

function mostrarMensaje(texto){

},2000);

function obtenerDatosJugador(){

const stats={};

document.querySelectorAll(".stat").forEach(stat=>{

const id=stat.dataset.stat;
const input=stat.querySelector("input");

stats[id]=Number(input.value);
});

return{

id:Date.now(),

nombre:
nombreInput.value.trim()||"PLAYER",

pais:paisActual,

posicion:posicionActual,

colores:{

document.getElementById("shirtColor1").value,

skinColor1:
document.getElementById("skinColor1").value,

logoColor1:
document.getElementById("logoColor1").value,

shortsColor1:
document.getElementById("shortsColor1").value
},

stats:stats
};
}

function guardarEnLocalStorage(){

localStorage.setItem(
"PSDX_JUGADORES",
JSON.stringify(jugadoresGuardados)
);
}

function renderizarJugadores(){

listaJugadores.innerHTML="";

if(jugadoresGuardados.length===0){

const vacio=document.createElement("div");
vacio.style.padding="10px";
vacio.style.textAlign="center";

vacio.appendChild(
crearTexto("NO SAVED PLAYERS")
);

listaJugadores.appendChild(vacio);

return;
}

jugadoresGuardados.forEach(jugador=>{

const elemento=document.createElement("div");

elemento.className="jugador-guardado";

if(jugador.id===jugadorSeleccionado)
elemento.classList.add("seleccionado");

const informacion=document.createElement("div");
informacion.className="jugador-guardado-info";

const nombre=document.createElement("div");
nombre.className="jugador-guardado-nombre";
nombre.appendChild(crearTexto(jugador.nombre));

const pais=document.createElement("div");
pais.className="jugador-guardado-pais";
pais.appendChild(crearTexto(jugador.pais));

const posicion=document.createElement("div");
posicion.className="jugador-guardado-posicion";
posicion.appendChild(crearTexto(jugador.posicion));

informacion.appendChild(nombre);
informacion.appendChild(pais);
informacion.appendChild(posicion);

elemento.appendChild(informacion);

const eliminar=document.createElement("button");

eliminar.className="boton-eliminar-jugador";
eliminar.textContent="X";

eliminar.addEventListener("click",e=>{

e.stopPropagation();
eliminarJugador(jugador.id);
});

elemento.appendChild(eliminar);

elemento.addEventListener("click",()=>{

jugadorSeleccionado=jugador.id;
renderizarJugadores();
});

listaJugadores.appendChild(elemento);
});
}

function eliminarJugador(id){

jugadoresGuardados=
jugadoresGuardados.filter(
jugador=>jugador.id!==id
);

if(jugadorSeleccionado===id)
jugadorSeleccionado=null;

guardarEnLocalStorage();
renderizarJugadores();

mostrarMensaje("PLAYER DELETED");
}

function cargarDatosJugador(jugador){

if(!jugador)return;

nombreInput.value=jugador.nombre;
actualizarNombre();

const pais=paises.find(
p=>p.nombre===jugador.pais
);

if(pais)
seleccionarPais(pais);

posicionActual=jugador.posicion;
posicionTemporal=jugador.posicion;

mostrarPosicion(
posicionActualElemento,
posicionActual
);

mostrarPosicion(
posicionSeleccionada,
posicionTemporal
);

marcarPosicion(posicionActual);

if(jugador.colores){

document.getElementById("shirtColor1").value=
jugador.colores.shirtColor1;

document.getElementById("shirtColor2").value=
jugador.colores.shirtColor2;

document.getElementById("hairColor1").value=
jugador.colores.hairColor1;

document.getElementById("skinColor1").value=
jugador.colores.skinColor1;

document.getElementById("logoColor1").value=
jugador.colores.logoColor1;

document.getElementById("shortsColor1").value=
jugador.colores.shortsColor1;
}

if(jugador.stats){

document.querySelectorAll(".stat").forEach(stat=>{

const id=stat.dataset.stat;
const input=stat.querySelector("input");

if(jugador.stats[id]!==undefined){

input.value=jugador.stats[id];

input.dispatchEvent(
new Event("input")
);
}
else if(id==="kep"){

input.value=0;

input.dispatchEvent(
new Event("input")
);
}
});
}

dibujarJugador();
}

botonGuardarJugador.addEventListener("click",()=>{

const datos=obtenerDatosJugador();

if(jugadorSeleccionado!==null){

const indice=
jugadoresGuardados.findIndex(
j=>j.id===jugadorSeleccionado
);

if(indice!==-1){

datos.id=jugadorSeleccionado;
jugadoresGuardados[indice]=datos;

guardarEnLocalStorage();
renderizarJugadores();

mostrarMensaje("PLAYER SAVED");

return;
}
}

jugadoresGuardados.push(datos);
jugadorSeleccionado=datos.id;

guardarEnLocalStorage();
renderizarJugadores();

mostrarMensaje("PLAYER SAVED");
});

botonCargarJugador.addEventListener("click",()=>{

if(jugadorSeleccionado===null){

mostrarMensaje("SELECT A PLAYER");
return;
}

const jugador=
jugadoresGuardados.find(
j=>j.id===jugadorSeleccionado
);

if(!jugador){

mostrarMensaje("PLAYER NOT FOUND");
return;
}

cargarDatosJugador(jugador);
mostrarMensaje("PLAYER LOADED");
});

function numeroAleatorio(min,max){

return Math.floor(
Math.random()*(max-min+1)
)+min;
}

function generarStatsSegunPosicion(posicion){

const perfil=perfilesPosicion[posicion];

const stats={};

for(const stat in perfil){

const rango=perfil[stat];

stats[stat]=numeroAleatorio(
rango[0],
rango[1]
);
}

return stats;
}

function aplicarStats(stats){

document.querySelectorAll(".stat").forEach(stat=>{

const id=stat.dataset.stat;
const input=stat.querySelector("input");

input.value=stats[id] ?? 0;

input.dispatchEvent(
new Event("input")
);
});
}
