<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>My National Team</title>

<style>

/* ==================================================
   CUERPO
================================================== */

body{

    background:#3E3546;

    margin:0;
    padding:40px;

    display:flex;

    justify-content:center;
    align-items:flex-start;

    font-family:Arial,sans-serif;

}


/* ==================================================
   PANEL PRINCIPAL
================================================== */

.panel{

    width:1000px;

    background:#694F62;

    border:4px solid #2E222F;

    box-shadow:6px 6px 0 #2E222F;

    padding:20px;

    box-sizing:border-box;

}


/* ==================================================
   TÍTULO
================================================== */

.titulo{

    width:100%;
    height:55px;

    background:#3E3546;

    border:3px solid #2E222F;

    box-sizing:border-box;

    display:flex;

    align-items:center;
    justify-content:center;

}


/* ==================================================
   PAÍS
================================================== */

.pais-panel{

    margin-top:20px;

    background:#514859;

    border:3px solid #2E222F;

    padding:12px;

    box-sizing:border-box;

}


.pais-selector{

    height:48px;

    background:#3E3546;

    border:3px solid #2E222F;

    display:flex;

    align-items:center;

    padding:5px;

    box-sizing:border-box;

    cursor:pointer;

}


.pais-selector:hover{

    background:#453B4C;

}


.pais-bandera{

    width:38px;
    height:30px;

    image-rendering:pixelated;

    margin-right:10px;

    object-fit:fill;

}


.pais-nombre{

    display:flex;

    align-items:center;

}


.pais-flecha{

    margin-left:auto;

    margin-right:8px;

    color:#B59B4A;

    font-size:18px;

}


/* ==================================================
   LISTA DE PAÍSES
================================================== */

.lista-paises{

    display:none;

    margin-top:8px;

    max-height:260px;

    overflow-y:auto;

    background:#3E3546;

    border:3px solid #2E222F;

    box-sizing:border-box;

}


.lista-paises.abierta{

    display:block;

}


.pais-opcion{

    height:42px;

    display:flex;

    align-items:center;

    padding:5px 8px;

    box-sizing:border-box;

    border-bottom:2px solid #2E222F;

    cursor:pointer;

}


.pais-opcion:last-child{

    border-bottom:none;

}


.pais-opcion:hover{

    background:#694F62;

}


.pais-opcion-bandera{

    width:38px;
    height:30px;

    margin-right:10px;

    image-rendering:pixelated;

    object-fit:fill;

}


/* ==================================================
   CONTENIDO PRINCIPAL
================================================== */

.contenido{

    margin-top:20px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}


/* ==================================================
   PANEL GENERAL
================================================== */

.seccion{

    background:#514859;

    border:3px solid #2E222F;

    padding:12px;

    box-sizing:border-box;

}


.seccion-titulo{

    height:38px;

    background:#3E3546;

    border:2px solid #2E222F;

    display:flex;

    align-items:center;

    padding-left:8px;

    box-sizing:border-box;

    margin-bottom:10px;

}


/* ==================================================
   FORMACIÓN
================================================== */

.formacion{

    width:100%;

}


.cancha{

    width:100%;

    height:310px;

    background:#4E704F;

    border:4px solid #FFF;

    box-sizing:border-box;

    position:relative;

    overflow:hidden;

    user-select:none;

}


/* ==================================================
   LÍNEA CENTRAL
================================================== */

.cancha::before{

    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:4px;
    height:100%;

    background:#FFF;

    transform:translateX(-50%);

}


/* ==================================================
   CÍRCULO CENTRAL
================================================== */

.circulo-central{

    position:absolute;

    left:50%;
    top:50%;

    width:80px;
    height:80px;

    border:4px solid #FFF;

    border-radius:50%;

    transform:translate(-50%,-50%);

    box-sizing:border-box;

}


.punto-central{

    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    background:#FFF;

    transform:translate(-50%,-50%);

}


/* ==================================================
   ÁREAS
================================================== */

.area-izquierda{

    position:absolute;

    left:-4px;
    top:78px;

    width:70px;
    height:142px;

    border:4px solid #FFF;

    border-left:none;

    box-sizing:border-box;

}


.area-derecha{

    position:absolute;

    right:-4px;
    top:78px;

    width:70px;
    height:142px;

    border:4px solid #FFF;

    border-right:none;

    box-sizing:border-box;

}


/* ==================================================
   JUGADORES EN CANCHA
================================================== */

.jugador-cancha{

    position:absolute;

    width:54px;
    height:42px;

    background:#3E3546;

    border:3px solid #FFF;

    display:flex;

    align-items:center;
    justify-content:center;

    box-sizing:border-box;

    cursor:grab;

    z-index:5;

    user-select:none;

    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;

    transition:
        background .1s,
        transform .1s;

}


.jugador-cancha:hover{

    background:#694F62;

    transform:scale(1.05);

    z-index:10;

}


.jugador-cancha.arrastrando{

    cursor:grabbing;

    background:#B59B4A;

    transform:scale(1.08);

    z-index:20;

}


/* ==================================================
   CUANDO HAY JUGADOR SELECCIONADO
================================================== */

.cancha.esperando-jugador
.jugador-cancha{

    cursor:pointer;

}


.cancha.esperando-jugador
.jugador-cancha:hover{

    background:#806176;

    transform:scale(1.05);

}


/* ==================================================
   JUGADOR ASIGNADO
================================================== */

.jugador-cancha.asignado{

    background:#3E3546;

}


.jugador-cancha.asignado:hover{

    background:#694F62;

}


/* ==================================================
   PORTERO
================================================== */

.pos-gk{

    left:0px;

    top:130px;

    cursor:pointer;

}


/* ==================================================
   POSICIONES INICIALES
================================================== */

.pos-lb{

    left:85px;
    top:30px;

}


.pos-cb1{

    left:75px;
    top:100px;

}


.pos-cb2{

    left:75px;
    top:180px;

}


.pos-rb{

    left:85px;
    top:250px;

}


.pos-lm{

    left:185px;
    top:40px;

}


.pos-cm{

    left:185px;
    top:134px;

}


.pos-rm{

    left:185px;
    top:228px;

}


.pos-lw{

    right:90px;
    top:50px;

}


.pos-rw{

    right:90px;
    top:218px;

}


.pos-st{

    right:60px;
    top:134px;

}


/* ==================================================
   ADVERTENCIA DE POSICIÓN
================================================== */

.advertencia-posicion{

    position:absolute;

    top:-5px;
    right:-5px;

    width:14px;
    height:14px;

    display:none;

    align-items:center;
    justify-content:center;

    pointer-events:none;

    z-index:30;

}


/* ==================================================
   FORMACIÓN ACTUAL
================================================== */

.formacion-actual{

    margin-top:10px;

    height:40px;

    background:#3E3546;

    border:2px solid #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ==================================================
   JUGADORES DISPONIBLES
================================================== */

.lista-jugadores{

    display:flex;

    flex-direction:column;

    gap:5px;

    max-height:360px;

    overflow-y:auto;

}


/* ==================================================
   JUGADOR DE LA LISTA
================================================== */

.jugador{

    min-height:44px;

    background:#3E3546;

    border:2px solid #2E222F;

    display:flex;

    align-items:center;

    padding:5px 7px;

    box-sizing:border-box;

    cursor:pointer;

}


.jugador:hover{

    background:#694F62;

}


.jugador.seleccionado{

    background:#806176;

}


/* ==================================================
   NÚMERO
================================================== */

.jugador-numero{

    width:32px;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-right:6px;

}


/* ==================================================
   NOMBRE
================================================== */

.jugador-nombre{

    flex:1;

    display:flex;

    align-items:center;

}


/* ==================================================
   POSICIÓN
================================================== */

.jugador-posicion{

    width:55px;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* ==================================================
   ESTADO
================================================== */

.jugador-estado{

    width:20px;

    display:flex;

    justify-content:center;

}


/* ==================================================
   TARJETA DEL JUGADOR
================================================== */

.jugador-info{

    margin-top:10px;

    background:#3E3546;

    border:2px solid #2E222F;

    padding:10px;

    box-sizing:border-box;

}


.jugador-info-nombre{

    min-height:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-bottom:2px solid #2E222F;

    margin-bottom:8px;

    position:relative;

}


/* ==================================================
   NOMBRE + BOTÓN INFO
================================================== */

.jugador-info-contenido{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    width:100%;

}


/* ==================================================
   BOTÓN ?
================================================== */

.boton-info-jugador{

    width:25px;

    height:25px;

    background:#3478C9;

    border:2px solid #2E222F;

    box-shadow:2px 2px 0 #2E222F;

    display:none;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-sizing:border-box;

}


.boton-info-jugador:hover{

    background:#4A8DDE;

}


.boton-info-jugador:active{

    box-shadow:none;

    transform:translate(2px,2px);

}


/* ==================================================
   DATOS DE JUGADOR
================================================== */

.jugador-info-datos{

    display:flex;

    justify-content:center;

    gap:20px;

}


/* ==================================================
   BOTONES
================================================== */

.botones{

    margin-top:20px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}


.boton{

    height:44px;

    background:#3E3546;

    border:3px solid #2E222F;

    box-shadow:3px 3px 0 #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-sizing:border-box;

}


.boton:hover{

    background:#453B4C;

}


.boton:active{

    box-shadow:none;

    transform:translate(3px,3px);

}


/* ==================================================
   SCROLLBARS
================================================== */

.lista-jugadores::-webkit-scrollbar,
.lista-paises::-webkit-scrollbar{

    width:10px;

}


.lista-jugadores::-webkit-scrollbar-track,
.lista-paises::-webkit-scrollbar-track{

    background:#2E222F;

}


.lista-jugadores::-webkit-scrollbar-thumb,
.lista-paises::-webkit-scrollbar-thumb{

    background:#694F62;

    border:2px solid #2E222F;

}


/* ==================================================
   MODAL INFORMACIÓN DEL JUGADOR
================================================== */

.modal-jugador{

    position:fixed;

    inset:0;

    background:rgba(46,34,47,.78);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:1000;

}


.modal-jugador.abierta{

    display:flex;

}


.modal-jugador-panel{

    width:620px;

    max-width:calc(100vw - 40px);

    max-height:calc(100vh - 40px);

    overflow-y:auto;

    background:#694F62;

    border:4px solid #2E222F;

    box-shadow:6px 6px 0 #2E222F;

    padding:15px;

    box-sizing:border-box;

}


/* ==================================================
   TÍTULO DEL MODAL
================================================== */

.modal-jugador-titulo{

    height:48px;

    background:#3E3546;

    border:3px solid #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

    box-sizing:border-box;

    position:relative;

}


.modal-jugador-cerrar{

    position:absolute;

    right:6px;

    top:6px;

    width:30px;

    height:30px;

    background:#B85C5C;

    border:2px solid #2E222F;

    box-shadow:2px 2px 0 #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}


.modal-jugador-cerrar:hover{

    background:#D16C6C;

}


/* ==================================================
   INFORMACIÓN BÁSICA
================================================== */

.modal-jugador-basico{

    margin-top:12px;

    background:#514859;

    border:3px solid #2E222F;

    padding:10px;

    box-sizing:border-box;

}


.modal-jugador-fila{

    min-height:38px;

    background:#3E3546;

    border:2px solid #2E222F;

    display:flex;

    align-items:center;

    padding:5px 8px;

    box-sizing:border-box;

    margin-bottom:6px;

}


.modal-jugador-fila:last-child{

    margin-bottom:0;

}


.modal-jugador-etiqueta{

    width:120px;

    display:flex;

    align-items:center;

}


.modal-jugador-valor{

    flex:1;

    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;

}


/* ==================================================
   POSICIONES
================================================== */

.modal-posiciones{

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;

}


.modal-posicion{

    min-width:45px;

    height:28px;

    background:#694F62;

    border:2px solid #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0 5px;

    box-sizing:border-box;

}


/* ==================================================
   STATS DEL MODAL
================================================== */

.modal-stats{

    margin-top:12px;

    background:#514859;

    border:3px solid #2E222F;

    padding:10px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    box-sizing:border-box;

}


.modal-stat{

    min-height:60px;

    background:#3E3546;

    border:2px solid #2E222F;

    padding:6px;

    box-sizing:border-box;

}


.modal-stat-texto{

    height:20px;

    display:flex;

    align-items:center;

}


.modal-stat-barra{

    display:flex;

    gap:2px;

    margin-top:5px;

    height:10px;

}


.modal-stat-bloque{

    width:12px;

    height:10px;

    background:#2E222F;

}


/* ==================================================
   BOTÓN CERRAR
================================================== */

.modal-jugador-boton-cerrar{

    margin-top:12px;

    height:40px;

    background:#3E3546;

    border:3px solid #2E222F;

    box-shadow:3px 3px 0 #2E222F;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}


.modal-jugador-boton-cerrar:hover{

    background:#453B4C;

}


.modal-jugador-boton-cerrar:active{

    box-shadow:none;

    transform:translate(3px,3px);

}


/* ==================================================
   CANVAS
================================================== */

canvas{

    display:block;

    image-rendering:pixelated;

}

</style>
<script src="favicon.js"></script>
<script
    type="module"
    src="psdx-presence.js"
></script>
</head>

     BOTONES

    <div

const ESCALA = .25;


/* ==================================================
   OBTENER GLIFOS
================================================== */

function obtenerGlifos(texto){

    const glifos = {};


    for(const caracter of texto){

        if(glifos[caracter])
            continue;


        const id =
            caracter.charCodeAt(0);


        const linea =
            lineas.find(
                l => l.startsWith(
                    `char id=${id} `
                )
            );


        if(!linea)
            continue;


        const datos = {};


        const partes =
            linea.match(
                /(\w+)=([^\s]+)/g
            );


        if(!partes)
            continue;


        partes.forEach(parte => {

            const [clave,valor] =
                parte.split("=");

            datos[clave] =
                Number(valor);

        });


        glifos[caracter] = datos;

    }


    return glifos;

}


/* ==================================================
   NORMALIZAR TEXTO
================================================== */

function normalizarTexto(texto){

    return String(texto)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toUpperCase();

}


/* ==================================================
   CREAR TEXTO PSDX
================================================== */

function crearTexto(texto){

    texto =
        texto === undefined ||
        texto === null
        ? ""
        : normalizarTexto(texto);


    const glifos =
        obtenerGlifos(texto);


    let anchoTotal = 0;

    let cursorCalculo = 0;


    for(const caracter of texto){

        const datos =
            glifos[caracter];


        if(!datos)
            continue;


        const derecha =
            cursorCalculo +
            datos.xoffset +
            datos.width;


        if(derecha > anchoTotal)
            anchoTotal = derecha;


        cursorCalculo +=
            datos.xadvance;

    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        Math.max(
            1,
            Math.ceil(
                anchoTotal * ESCALA
            )
        );


    canvas.height =
        Math.ceil(
            112 * ESCALA
        );


    const ctx =
        canvas.getContext("2d");


    ctx.imageSmoothingEnabled = false;


    let cursorX = 0;


    for(const caracter of texto){

        const datos =
            glifos[caracter];


        if(!datos)
            continue;


        ctx.drawImage(

            imagen,

            datos.x,
            datos.y,
            datos.width,
            datos.height,

            cursorX +
            datos.xoffset * ESCALA,

            datos.yoffset * ESCALA,

            datos.width * ESCALA,

            datos.height * ESCALA

        );


        cursorX +=
            datos.xadvance * ESCALA;

    }


    return canvas;

}


/* ==================================================
   CREAR TEXTO PSDX CON COLOR
================================================== */

function crearTextoColor(texto,color){

    const canvas =
        crearTexto(texto);


    const ctx =
        canvas.getContext("2d");


    ctx.globalCompositeOperation =
        "source-in";


    ctx.fillStyle =
        color;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.globalCompositeOperation =
        "source-over";


    return canvas;

}

                codigo

            return;

        const datos =
            await respuesta.json();

        /*
           Solo importamos si realmente existe un once.
           El primer jugador sigue siendo el GK.
        */
        if(
            !datos ||
            !Array.isArray(datos.players) ||
            datos.players.length !== 11
        ){

            console.log(
                "No hay un XI completo para:",
                codigo
            );

            return;

        }

        await importarXI(
            datos,
            false
        );

        console.log(
            "XI cargado automáticamente:",
            codigo
        );

    }
    catch(error){

        /*

           error visible ni impedir seleccionar el país.
        */
        console.log(
            "No se pudo cargar XI automático para:",
            codigo
        );

    }

}

const COLUMNAS = 9;

const FILAS = 7;

const MARGEN_X = 30;

const MARGEN_Y = 25;


/* ==================================================
   OBTENER LÍMITES DEL GRID
================================================== */

function obtenerLimitesGrid(){

    const ancho =
        cancha.clientWidth;


    const alto =
        cancha.clientHeight;


    const jugadorAncho = 54;

    const jugadorAlto = 42;


    const minX =
        MARGEN_X;


    const maxX =
        ancho -
        jugadorAncho -
        MARGEN_X;


    const minY =
        MARGEN_Y;


    const maxY =
        alto -
        jugadorAlto -
        MARGEN_Y;


    return {

        minX,
        maxX,
        minY,
        maxY

    };

}


/* ==================================================
   OBTENER PUNTO DEL GRID
================================================== */

function obtenerPuntoGrid(x,y){

    const limites =
        obtenerLimitesGrid();


    const espacioX =
        (
            limites.maxX -
            limites.minX
        )
        /
        (
            COLUMNAS - 1
        );


    const espacioY =
        (
            limites.maxY -
            limites.minY
        )
        /
        (
            FILAS - 1
        );


    let columna =
        Math.round(
            (
                x -
                limites.minX
            )
            /
            espacioX
        );


    let fila =
        Math.round(
            (
                y -
                limites.minY
            )
            /
            espacioY
        );


    columna =
        Math.max(
            0,
            Math.min(
                COLUMNAS - 1,
                columna
            )
        );


    fila =
        Math.max(
            0,
            Math.min(
                FILAS - 1,
                fila
            )
        );


    return {

        x:
            limites.minX +
            columna *
            espacioX,

        y:
            limites.minY +
            fila *
            espacioY,

        columna,
        fila

    };

}


/* ==================================================
   LIMITAR POSICIÓN
================================================== */

function limitarPosicion(x,y){

    const limites =
        obtenerLimitesGrid();


    return {

        x:
            Math.max(
                limites.minX,
                Math.min(
                    limites.maxX,
                    x
                )
            ),

        y:
            Math.max(
                limites.minY,
                Math.min(
                    limites.maxY,
                    y
                )
            )

    };

}

*/

function obtenerEstadoPosicion(
    posicionesJugador,
    posicionCancha
){

    if(
        !posicionesJugador ||
        !posicionCancha
    ){

        return "incompatible";

    }


    let posiciones = [];


    try{

        posiciones =
            JSON.parse(
                posicionesJugador
            );

    }catch{

        posiciones = [
            posicionesJugador
        ];

    }


    if(!Array.isArray(posiciones)){

        posiciones = [
            posiciones
        ];

    }


    posiciones =
        posiciones.map(
            posicion =>
                normalizarTexto(posicion)
        );


    /* ==================================================
       1. POSICIÓN EXACTA
    ================================================== */

    if(
        posiciones.includes(
            posicionCancha
        )
    ){

        return "exacta";

    }


    /* ==================================================
       2. POSICIÓN COMPATIBLE
    ================================================== */

    const esCompatible =
        posiciones.some(
            posicionJugador => {

                const compatibles =
                    posicionesCompatibles[
                        posicionJugador
                    ];


                if(!compatibles)
                    return false;


                return compatibles.includes(
                    posicionCancha
                );

            }
        );


    if(esCompatible){

        return "compatible";

    }


    /* ==================================================
       3. POSICIÓN INCOMPATIBLE
    ================================================== */

    return "incompatible";

}


/* ==================================================
   COMPROBAR POSICIÓN
================================================== */

function posicionEsAdecuada(
    posicionesJugador,
    posicionCancha
){

    const estado =
        obtenerEstadoPosicion(
            posicionesJugador,
            posicionCancha
        );


    return (
        estado === "exacta" ||
        estado === "compatible"
    );

}


/* ==================================================
   MOSTRAR ADVERTENCIA
================================================== */

function actualizarAdvertencia(
    jugadorCancha
){

    const advertencia =
        jugadorCancha.querySelector(
            ".advertencia-posicion"
        );


    if(!advertencia)
        return;


    advertencia.innerHTML = "";


    const jugador =
        jugadorCancha.dataset.jugador;


    if(!jugador){

        advertencia.style.display =
            "none";

        return;

    }


    const posicionCancha =
        jugadorCancha.dataset.posicion;


    const posicionesJugador =
        jugadorCancha.dataset.jugadorPosicion;


    const estado =
        obtenerEstadoPosicion(
            posicionesJugador,
            posicionCancha
        );


    /* ==================================================
       POSICIÓN EXACTA
    ================================================== */

    if(estado === "exacta"){

        advertencia.style.display =
            "none";

        return;

    }


    /* ==================================================
       POSICIÓN COMPATIBLE = AMARILLO
    ================================================== */

    if(estado === "compatible"){

        advertencia.style.display =
            "flex";


        advertencia.appendChild(
            crearTextoColor(
                ".",
                "#FFD83D"
            )
        );


        return;

    }


    /* ==================================================
       POSICIÓN INCOMPATIBLE = ROJO
    ================================================== */

    if(estado === "incompatible"){

        advertencia.style.display =
            "flex";


        advertencia.appendChild(
            crearTextoColor(
                ".",
                "#FF0000"
            )
        );

    }

}

    cuadro
){

        return;


    const numero =
        jugadorLista.dataset.numero;


    const nombre =
        jugadorLista.dataset.nombre;


    const posicion =
        jugadorLista.dataset.posicion;

        jugadorLista.dataset.posiciones ||
        "[]";


    const cuadroAnterior =
        document.querySelector(
            `.jugador-cancha[data-jugador="${numero}"]`
        );


    if(
        cuadroAnterior &&
        cuadroAnterior !== cuadro
    ){

        limpiarCuadro(
            cuadroAnterior
        );

    }


    if(
        cuadro.dataset.jugador &&
        cuadro.dataset.jugador !== numero
    ){

        const anterior =
            document.querySelector(
                `.jugador[data-numero="${cuadro.dataset.jugador}"]`
            );


        if(anterior){

            actualizarEstadoJugador(
                anterior
            );

        }

    }


    cuadro.dataset.jugador =
        numero;


    cuadro.dataset.numero =
        numero;


    cuadro.dataset.jugadorNombre =
        nombre;


    cuadro.dataset.jugadorPosicion =
        posiciones;

        "asignado"
    );

        cuadro
    );

        cuadro

/* ==================================================
   CREAR BARRA DE STAT
   MISMA LÓGICA DE EDITOR.HTML
================================================== */

function crearBarraStat(valor){

    valor =
        Number(valor);


    if(isNaN(valor))
        valor = 0;


    valor =
        Math.max(
            0,
            Math.min(
                10,
                valor
            )
        );


    const barra =
        document.createElement(
            "div"
        );


    barra.className =
        "modal-stat-barra";


    let color = null;


    if(valor >= 8){

        color =
            "#6FAF5F";

    }
    else if(valor >= 5){

        color =
            "#B59B4A";

    }
    else if(valor >= 1){

        color =
            "#B85C5C";

    }


    for(
        let i = 0;
        i < 10;
        i++
    ){

        const bloque =
            document.createElement(
                "div"
            );


        bloque.className =
            "modal-stat-bloque";


        if(i < valor){

            bloque.style.background =
                color;

        }


        barra.appendChild(
            bloque
        );

    }


    return barra;

}

/* ==================================================
   JUGADORES DE CANCHA
================================================== */

const jugadoresCancha =
    document.querySelectorAll(
        ".jugador-cancha"
    );


jugadoresCancha.forEach(
    jugadorCancha => {


    /*
       GK NO SE ARRASTRA.
       El portero se mantiene en su cuadro especial.
    */

    if(
        jugadorCancha.dataset.posicion === "GK"
    ){

        jugadorCancha.addEventListener(
            "click",
            () => {

                if(
                    jugadorSeleccionado
                ){

                    asignarJugador(
                        jugadorSeleccionado,
                        jugadorCancha
                    );

                }

            }
        );

        return;

    }


    let arrastrando = false;

    let offsetX = 0;

    let offsetY = 0;


    /*
       POINTER EVENTS permiten usar exactamente
       el mismo arrastre con mouse, dedo o stylus.
    */
    jugadorCancha.addEventListener(
        "pointerdown",
        evento => {

            if(
                jugadorSeleccionado
            ){

                return;

            }

            evento.preventDefault();

            jugadorCancha.setPointerCapture(
                evento.pointerId
            );

            const rectJugador =
                jugadorCancha
                .getBoundingClientRect();


            offsetX =
                evento.clientX -
                rectJugador.left;


            offsetY =
                evento.clientY -
                rectJugador.top;


            arrastrando = true;

            jugadorCancha.classList.add(
                "arrastrando"
            );

            jugadorCancha.style.transition =
                "none";

        }
    );


    jugadorCancha.addEventListener(
        "pointermove",
        evento => {

            if(!arrastrando)
                return;

            evento.preventDefault();

            const rectCancha =
                cancha
                .getBoundingClientRect();


            let x =
                evento.clientX -
                rectCancha.left -
                offsetX;


            let y =
                evento.clientY -
                rectCancha.top -
                offsetY;


            const posicion =
                limitarPosicion(
                    x,
                    y
                );


            jugadorCancha.style.left =
                posicion.x + "px";


            jugadorCancha.style.top =
                posicion.y + "px";

        }
    );


    function terminarArrastre(evento){

        if(!arrastrando)
            return;

        if(evento){
            evento.preventDefault();
        }

        arrastrando = false;

        jugadorCancha.classList.remove(
            "arrastrando"
        );

        jugadorCancha.style.transition =
            "";


        const x =
            parseFloat(
                jugadorCancha.style.left
            );


        const y =
            parseFloat(
                jugadorCancha.style.top
            );


        const punto =
            obtenerPuntoGrid(
                x,
                y
            );


        jugadorCancha.style.left =
            punto.x + "px";


        jugadorCancha.style.top =
            punto.y + "px";


        actualizarPosicionJugador(
            jugadorCancha,
            punto.columna,
            punto.fila
        );

    }


    jugadorCancha.addEventListener(
        "pointerup",
        terminarArrastre
    );


    jugadorCancha.addEventListener(
        "pointercancel",
        terminarArrastre
    );


    jugadorCancha.addEventListener(
        "lostpointercapture",
        () => {

            if(arrastrando){
                terminarArrastre();
            }

        }
    );


    jugadorCancha.addEventListener(
        "click",
        () => {

            if(
                jugadorSeleccionado
            ){

                asignarJugador(
                    jugadorSeleccionado,
                    jugadorCancha
                );

            }

        }
    );


});

/* ==================================================
   CREAR DATOS DEL XI
================================================== */

function obtenerDatosXI(){

    const jugadores = [];

    document
    .querySelectorAll(".jugador-cancha")
    .forEach(cuadro => {

        if(!cuadro.dataset.jugador)
            return;

        const estado =
            cuadro.dataset.estadoPunto ||
            obtenerEstadoPosicion(
                cuadro.dataset.jugadorPosicion || "[]",
                cuadro.dataset.posicion || ""
            ) === "exacta"
                ? "natural"
                : obtenerEstadoPosicion(
                    cuadro.dataset.jugadorPosicion || "[]",
                    cuadro.dataset.posicion || ""
                ) === "compatible"
                    ? "yellow"
                    : "red";

        jugadores.push({

            number:
                Number(cuadro.dataset.numero),

            column:
                Number(cuadro.dataset.columna),

            row:
                Number(cuadro.dataset.fila),

            status:
                estado

        });

    });

    return {

        country:
            paisActual,

        players:
            jugadores

    };

}


/* ==================================================
   EXPORTAR XI COMO JSON
================================================== */

function guardarXI(){

    const datosXI =
        obtenerDatosXI();

    const blob =
        new Blob(
            [
                JSON.stringify(
                    datosXI,
                    null,
                    4
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const enlace =
        document.createElement(
            "a"
        );

    enlace.href =
        url;

    enlace.download =
        datosXI.country +
        "_XI.json";

    document.body.appendChild(
        enlace
    );

    enlace.click();

    enlace.remove();

    URL.revokeObjectURL(
        url
    );

    console.log(
        "XI guardado:",
        datosXI
    );

}


/* ==================================================
   OBTENER CUADRO POR GRID
================================================== */

function obtenerCuadroPorGrid(
    columna,
    fila
){

    const cuadros =
        document.querySelectorAll(
            ".jugador-cancha"
        );

    for(
        const cuadro of cuadros
    ){

        if(
            Number(cuadro.dataset.columna) === columna &&
            Number(cuadro.dataset.fila) === fila
        ){

            return cuadro;

        }

    }

    return null;

}


/* ==================================================
   POSICIONAR CUADRO FÍSICAMENTE
================================================== */

function posicionarCuadroEnGrid(
    cuadro,
    columna,
    fila
){

    const limites =
        obtenerLimitesGrid();

    const espacioX =
        (
            limites.maxX -
            limites.minX
        )
        /
        (
            COLUMNAS - 1
        );

    const espacioY =
        (
            limites.maxY -
            limites.minY
        )
        /
        (
            FILAS - 1
        );

    cuadro.style.left =
        (
            limites.minX +
            columna *
            espacioX
        ) + "px";

    cuadro.style.top =
        (
            limites.minY +
            fila *
            espacioY
        ) + "px";

    cuadro.dataset.columna =
        columna;

    cuadro.dataset.fila =
        fila;

    /*
       IMPORTANTE:
       La posición se obtiene de la coordenada REAL,
       incluyendo 0,3 = GK.
    */
    const posicion =
        obtenerPosicionPorGrid(
            columna,
            fila
        );

    if(posicion){

        cuadro.dataset.posicion =
            posicion;

    }

}

/* ==================================================

function asignarJugadorImportado(
    jugadorLista,
    cuadro
){

    if(!jugadorLista || !cuadro)
        return;

    const numero =
        jugadorLista.dataset.numero;

    /*
       Si el jugador ya estaba colocado en otro cuadro,
       se libera primero.
    */
    const cuadroAnterior =
        document.querySelector(
            `.jugador-cancha[data-jugador="${numero}"]`
        );

    if(
        cuadroAnterior &&
        cuadroAnterior !== cuadro
    ){

        limpiarCuadro(
            cuadroAnterior
        );

    }

    /*
       Si el cuadro ya tenía otro jugador,
       se limpia.
    */
    if(
        cuadro.dataset.jugador &&
        cuadro.dataset.jugador !== numero
    ){

        limpiarCuadro(
            cuadro
        );

    }

    cuadro.dataset.jugador =
        numero;

    cuadro.dataset.numero =
        numero;

    cuadro.dataset.jugadorNombre =
        jugadorLista.dataset.nombre;

    cuadro.dataset.jugadorPosicion =
        jugadorLista.dataset.posiciones ||
        "[]";

    cuadro.classList.add(
        "asignado"
    );

    /*
       NO usamos status del JSON.
       Se recalcula desde la posición real.
    */
    actualizarAdvertencia(
        cuadro
    );

    actualizarNumeroCancha(
        cuadro
    );

}


/* ==================================================
   IMPORTAR XI
================================================== */

async function importarXI(datos, cambiarPaisAntes = true){

    if(
        !datos ||
        !Array.isArray(datos.players)
    ){

        throw new Error(
            "El JSON no contiene una lista válida 'players'."
        );

    }

    /*
       El país del XI importado pasa a ser
       el país actual.
    */
    if(
        cambiarPaisAntes &&
        datos.country
    ){

        const codigo =
            String(
                datos.country
            ).toUpperCase();

        await cambiarPais(
            codigo
        );

    }

    /*
       Esperamos a que los jugadores del país
       estén cargados antes de colocarlos.
    */
    limpiarXIActual();

    for(
        let indice = 0;
        indice < datos.players.length;
        indice++
    ){

        const jugadorXI =
            datos.players[indice];

        const numero =
            Number(
                jugadorXI.number
            );

        const jugadorLista =
            document.querySelector(
                `.jugador[data-numero="${numero}"]`
            );

        if(!jugadorLista){

            console.warn(
                "No se encontró el jugador número:",
                numero
            );

            continue;

        }

        /*
           EL PRIMER JUGADOR DEL XI ES SIEMPRE EL GK.

           Esto es importante porque column:0,row:3
           también puede ser una posición válida del grid
           para un defensa. Por eso NO usamos las coordenadas
           para decidir quién es el portero.
        */
        if(indice === 0){

            const cuadroGK =
                document.querySelector(
                    '.jugador-cancha[data-posicion="GK"]'
                );

            if(!cuadroGK){

                console.warn(
                    "No se encontró el cuadro GK."
                );

                continue;

            }

            asignarJugadorImportado(
                jugadorLista,
                cuadroGK
            );

            actualizarAdvertencia(
                cuadroGK
            );

            continue;

        }

        const columna =
            Number(
                jugadorXI.column
            );

        const fila =
            Number(
                jugadorXI.row
            );

        if(
            !Number.isInteger(columna) ||
            !Number.isInteger(fila)
        ){

            console.warn(
                "Coordenada inválida:",
                jugadorXI
            );

            continue;

        }

        if(
            columna < 0 ||
            columna >= COLUMNAS ||
            fila < 0 ||
            fila >= FILAS
        ){

            console.warn(
                "Coordenada fuera del grid:",
                jugadorXI
            );

            continue;

        }

        /*
           Los otros diez jugadores sí utilizan
           exclusivamente el grid.
        */
        let cuadro =
            obtenerCuadroPorGrid(
                columna,
                fila
            );

        /*
           Si dos jugadores ocuparan accidentalmente
           la misma coordenada, buscamos un cuadro libre
           entre los cuadros NO-GK.
        */
        if(
            !cuadro ||
            (
                cuadro.dataset.jugador &&
                cuadro.dataset.jugador !==
                String(numero)
            )
        ){

            cuadro =
                Array.from(
                    document.querySelectorAll(
                        ".jugador-cancha:not([data-posicion='GK'])"
                    )
                ).find(
                    c =>
                        !c.dataset.jugador
                );

        }

        if(!cuadro){

            console.warn(
                "No hay cuadro disponible para:",
                numero
            );

            continue;

        }

        /*
           Los jugadores de campo sí se posicionan
           mediante column + row.
        */
        posicionarCuadroEnGrid(
            cuadro,
            columna,
            fila
        );

        asignarJugadorImportado(
            jugadorLista,
            cuadro
        );

        actualizarAdvertencia(
            cuadro
        );

    }

    document
    .querySelectorAll(
        ".jugador"
    )
    .forEach(
        actualizarEstadoJugador
    );

    jugadorSeleccionado =
        null;

    jugadorSeleccionadoDatos =
        null;

    cancha.classList.remove(
        "esperando-jugador"
    );

    botonInfoJugador.style.display =
        "none";

    colocarTexto(
        jugadorInfoContenido,
        "SELECT A PLAYER"
    );

    colocarTexto(
        document.getElementById(
            "jugadorInfoPais"
        ),
        paisActual
    );

    colocarTexto(
        document.getElementById(
            "jugadorInfoPosicion"
        ),
        ""
    );

    console.log(
        "XI importado:",
        datos
    );

}

================================================== */

archivoXI.addEventListener(
    "change",
    async event => {

        const archivo =
            event.target.files[0];

        if(!archivo)
            return;

        try{

            const texto =
                await archivo.text();

            const datos =
                JSON.parse(
                    texto
                );

            await importarXI(
                datos
            );

        }
        catch(error){

            console.error(
                "ERROR AL IMPORTAR XI:",
                error
            );

            alert(
                "No se pudo importar el XI."
            );

        }

    }
);
