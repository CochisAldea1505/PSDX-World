================================================== */

.selectores-partido{

.pais-nombre{

<script>

/* ==================================================
   PSDX FONT
================================================== */

fetch("PSDX_Font1.fnt")

.then(response=>response.text())

.then(data=>{

const lineas=data.split("\n");

const imagenFont=new Image();

imagenFont.src="PSDX_Font1.png";

imagenFont.onload=()=>{

const ESCALA=.25;


/* ==================================================
   GLIFOS
================================================== */

function obtenerGlifos(texto){

const glifos={};

for(const caracter of texto){

if(glifos[caracter])
continue;

const id=
caracter.charCodeAt(0);

const linea=
lineas.find(
l=>l.startsWith(`char id=${id} `)
);

if(!linea)
continue;

const datos={};

const partes=
linea.match(
/(\w+)=([^\s]+)/g
);

if(!partes)
continue;

partes.forEach(parte=>{

const [clave,valor]=
parte.split("=");

datos[clave]=
Number(valor);

});

glifos[caracter]=
datos;

}

return glifos;

}


/* ==================================================
   CREAR TEXTO
================================================== */

function crearTexto(texto){

texto=
texto===undefined||
texto===null
?
""
:
String(texto);

const glifos=
obtenerGlifos(texto);

let anchoTotal=0;

let cursorCalculo=0;

for(const caracter of texto){

const datos=
glifos[caracter];

if(!datos)
continue;

const derecha=
cursorCalculo+
datos.xoffset+
datos.width;

if(derecha>anchoTotal)
anchoTotal=derecha;

cursorCalculo+=
datos.xadvance;

}

const canvas=
document.createElement("canvas");

canvas.width=
Math.max(
1,
Math.ceil(
anchoTotal*ESCALA
)
);

canvas.height=
Math.ceil(
112*ESCALA
);

const ctx=
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

let cursorX=0;

for(const caracter of texto){

const datos=
glifos[caracter];

if(!datos)
continue;

ctx.drawImage(

imagenFont,

datos.x,
datos.y,
datos.width,
datos.height,

cursorX+
datos.xoffset*ESCALA,

datos.yoffset*ESCALA,

datos.width*ESCALA,
datos.height*ESCALA

);

cursorX+=
datos.xadvance*ESCALA;

}

return canvas;

}


/* ==================================================
   PONER TEXTO
================================================== */

function ponerTexto(
elemento,
texto
){

elemento.innerHTML="";

elemento.appendChild(
crearTexto(texto)
);

}


/* ==================================================
   BANDERAS
================================================== */

const RECORTE_X=88;
const RECORTE_Y=149;
const RECORTE_ANCHO=590;
const RECORTE_ALTO=470;

const ESCALA_BANDERA=.15;


function cargarBandera(
archivo,
canvas
){

const bandera=
new Image();

bandera.src=
"FLAGS PSDX/"+archivo;

bandera.onload=()=>{

canvas.width=
RECORTE_ANCHO*
ESCALA_BANDERA;

canvas.height=
RECORTE_ALTO*
ESCALA_BANDERA;

const ctx=
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(

bandera,

RECORTE_X,
RECORTE_Y,

RECORTE_ANCHO,
RECORTE_ALTO,

0,
0,

RECORTE_ANCHO*
ESCALA_BANDERA,

RECORTE_ALTO*
ESCALA_BANDERA

);

};

}


/* ==================================================
   BANDERA PARA SELECTOR
   MISMO ESTILO DE EDITOR.HTML
================================================== */

function crearBanderaSelector(
codigo
){

const canvas=
document.createElement("canvas");

canvas.width=38;
canvas.height=30;

canvas.className=
"pais-bandera";

const imagen=
new Image();

imagen.src=
"FLAGS PSDX/"+
codigo+
".png";

imagen.onload=()=>{

const ctx=
canvas.getContext("2d");

ctx.imageSmoothingEnabled=false;

ctx.clearRect(
0,
0,
38,
30
);

ctx.drawImage(

imagen,

RECORTE_X,
RECORTE_Y,

RECORTE_ANCHO,
RECORTE_ALTO,

0,
0,
38,
30

);

};

return canvas;

}

/* ==================================================
   ENCONTRAR JUGADOR
================================================== */

function buscarJugador(
lista,
referencia
){

if(!referencia)
return null;

if(typeof referencia==="string"){

return lista.find(
j=>
String(j.name).toLowerCase()===
referencia.toLowerCase()
);

}

const numero=
Number(
referencia.number ??
referencia.numero ??
-1
);

const nombre=
referencia.name ??
referencia.nombre ??
null;

if(nombre){

const encontrado=
lista.find(
j=>
String(j.name).toLowerCase()===
String(nombre).toLowerCase()
);

if(encontrado)
return encontrado;

}

if(numero>=0){

return lista.find(
j=>
Number(j.number)===numero
);

}

return null;

}

/* ==================================================
   EXTRAER COORDENADA REAL DEL XI
================================================== */

/*
   MUY IMPORTANTE:

   La coordenada del Team_XI tiene prioridad
   absoluta sobre la posición.

   Orden:

   1. coord
   2. coordinates
   3. position/pos con x,y
   4. x/y
   5. columna/fila
   6. grid
   7. fallback por posición

   Esto evita que jugadores que ocupan la misma
   posición terminen automáticamente en la misma
   coordenada.
*/

function obtenerCoordenadaXI(
entrada,
posicion
){

/* -----------------------------------------------
   coord: [x,y]
------------------------------------------------ */

if(
Array.isArray(
entrada.coord
)
&&
entrada.coord.length>=2
){

const x=
Number(
entrada.coord[0]
);

const y=
Number(
entrada.coord[1]
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   coord: "x,y"
------------------------------------------------ */

if(
typeof entrada.coord==="string"
){

const partes=
entrada.coord.split(",");

if(partes.length===2){

const x=
Number(partes[0]);

const y=
Number(partes[1]);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}

}


/* -----------------------------------------------
   coordinates: [x,y]
------------------------------------------------ */

if(
Array.isArray(
entrada.coordinates
)
&&
entrada.coordinates.length>=2
){

const x=
Number(
entrada.coordinates[0]
);

const y=
Number(
entrada.coordinates[1]
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   coordinates: {x,y}
------------------------------------------------ */

if(
entrada.coordinates &&
typeof entrada.coordinates==="object"
){

const x=
Number(
entrada.coordinates.x
);

const y=
Number(
entrada.coordinates.y
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   position / posicion con coordenadas
------------------------------------------------ */

const posicionDatos=
entrada.position &&
typeof entrada.position==="object"
?
entrada.position
:
(
entrada.posicion &&
typeof entrada.posicion==="object"
?
entrada.posicion
:
null
);

if(posicionDatos){

const x=
Number(
posicionDatos.x
);

const y=
Number(
posicionDatos.y
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   x / y directos
------------------------------------------------ */

if(
entrada.x!==undefined &&
entrada.y!==undefined
){

const x=
Number(entrada.x);

const y=
Number(entrada.y);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   columna / fila
------------------------------------------------ */

if(
entrada.columna!==undefined &&
entrada.fila!==undefined
){

const x=
Number(
entrada.columna
);

const y=
Number(
entrada.fila
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   column / row
------------------------------------------------ */

if(
entrada.column!==undefined &&
entrada.row!==undefined
){

const x=
Number(
entrada.column
);

const y=
Number(
entrada.row
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   grid: {x,y}
------------------------------------------------ */

if(
entrada.grid &&
typeof entrada.grid==="object"
){

const x=
Number(
entrada.grid.x ??
entrada.grid.columna ??
entrada.grid.column
);

const y=
Number(
entrada.grid.y ??
entrada.grid.fila ??
entrada.grid.row
);

if(
Number.isFinite(x) &&
Number.isFinite(y)
){

return{x,y};

}

}


/* -----------------------------------------------
   FALLBACK
------------------------------------------------ */

return{

x:
posicionBase[posicion]?.[0]
??
4,

y:
posicionBase[posicion]?.[1]
??
3

};

}


/* ==================================================
   PUNTO NATURAL
================================================== */

function obtenerTipoPunto(
jugador,
posicion,
entrada
){

const valor=
entrada?.point ??
entrada?.dot ??
entrada?.punto ??
entrada?.estado ??
entrada?.status ??
null;

if(valor){

const texto=
String(valor).toLowerCase();

if(
texto==="red" ||
texto==="rojo"
)
return"rojo";

if(
texto==="yellow" ||
texto==="amarillo"
)
return"amarillo";

}

const naturales=
Array.isArray(
jugador.position
)
?
jugador.position
:
[];

if(
naturales.includes(posicion)
){

return"natural";

}

const cercanas={

GK:["GK"],

LB:["LB","RB","LM"],

CB:["CB","CDM"],

RB:["RB","LB","RM"],

LM:["LM","LW","CM"],

CDM:["CDM","CM","CB"],

CM:["CM","CDM","CAM","LM","RM"],

RM:["RM","RW","CM"],

CAM:["CAM","CM","ST","LW","RW"],

LW:["LW","RW","LM","CAM"],

RW:["RW","LW","RM","CAM"],

ST:["ST","CAM","LW","RW"]

};

if(
(cercanas[posicion]||[])
.some(
p=>naturales.includes(p)
)
){

return"amarillo";

}

return"rojo";

}


/* ==================================================
   MODIFICADOR
================================================== */

function modificadorPunto(
tipo
){

if(tipo==="rojo")
return-2;

if(tipo==="amarillo")
return-1;

return 0;

}


/* ==================================================
   STATS
================================================== */

function prepararStats(
jugador,
tipo
){

const stats={
...jugador.stats
};

const modificador=
modificadorPunto(tipo);

for(const stat in stats){

if(stat==="STA")
continue;

stats[stat]=
Math.max(
0,
Math.min(
10,
Math.round(
stats[stat]+
modificador
)
)
);

}

return stats;

}


/* ==================================================
   BONUS
================================================== */

function bonus(){

const valores=[
0,
0,
0,
1,
-1,
1,
-1,
2,
0
];

return valores[
Math.floor(
Math.random()*
valores.length
)
];

}


/* ==================================================
   COORDENADA REAL
================================================== */

function coordenadaValida(
coord
){

return{

x:Math.max(
0,
Math.min(
8,
Number(coord.x)
)
),

y:Math.max(
0,
Math.min(
6,
Number(coord.y)
)
)

};

}


/* ==================================================
   CREAR XI
================================================== */

function extraerEntradasXI(
datos
){

if(Array.isArray(datos))
return datos;

if(Array.isArray(datos.players))
return datos.players;

if(Array.isArray(datos.playersXI))
return datos.playersXI;

if(Array.isArray(datos.xi))
return datos.xi;

if(Array.isArray(datos.startingXI))
return datos.startingXI;

if(Array.isArray(datos.once))
return datos.once;

if(Array.isArray(datos.lineup))
return datos.lineup;

if(datos.players){

return Object.values(
datos.players
);

}

return[];

}


function construirXI(
codigo,
datosXI,
jugadores
){

const entradas=
extraerEntradasXI(
datosXI
);

const resultado=[];

for(const entrada of entradas){

const referencia=
entrada.player ??
entrada.jugador ??
entrada;

const jugadorBase=
buscarJugador(
jugadores,
referencia
);

if(!jugadorBase){

debug(
`No se encontró jugador para una entrada del XI de ${codigo}`,
"result"
);

continue;

}

const jugador=
normalizarJugador(
jugadorBase
);

const posicion=
String(
entrada.position ??
entrada.posicion ??
entrada.role ??
jugador.position?.[0] ??
"CM"
).toUpperCase();


/*
   LA COORDENADA VIENE DEL XI.

   NO SE CALCULA A PARTIR DE LA POSICIÓN
   SI EL XI YA TIENE UNA COORDENADA.
*/

let coord=
obtenerCoordenadaXI(
entrada,
posicion
);

coord=
coordenadaValida(
coord
);


/*
   El visitante se visualiza invertido,
   pero la coordenada original del XI
   sigue siendo respetada.

   Guardamos ambas.
*/

const coordXI={
...coord
};

if(codigo===codigoVisitante){

coord=
invertirCoordenada(
coord
);

}


const tipoPunto=
obtenerTipoPunto(
jugador,
posicion,
entrada
);

const stats=
prepararStats(
jugador,
tipoPunto
);

resultado.push({

...jugador,

equipo:codigo,

nombre:jugador.name,

posicion,

coord,

coordXI,

coordInicial:{
...coord
},

punto:tipoPunto,

statsOriginales:{
...jugador.stats
},

stats,

activo:true

});

}

return resultado;

}

/* ==================================================
   DISTANCIA
================================================== */

function distancia(a,b){

return Math.sqrt(

Math.pow(
a.x-b.x,
2
)+

Math.pow(
a.y-b.y,
2
)

);

}

/* ==================================================
   INTERCEPTORES
================================================== */

function candidatosIntercepcion(
pasador,
equipoDefensor
){

const lista=
equipoDefensor.once;

const posicion=
pasador.posicion;

let posiciones=[];

switch(posicion){

case"CB":

posiciones=[
"ST",
"LW",
"RW",
"CAM"
];

break;

case"LB":

posiciones=[
"RW",
"RM",
"ST"
];

break;

case"RB":

posiciones=[
"LW",
"LM",
"ST"
];

break;

case"CDM":

posiciones=[
"CAM",
"ST",
"LW",
"RW"
];

break;

case"CM":

posiciones=[
"CAM",
"ST",
"LW",
"RW"
];

break;

case"CAM":

posiciones=[
"CDM",
"CM",
"CB"
];

break;

case"LM":

posiciones=[
"RB",
"CB",
"RM"
];

break;

case"RM":

posiciones=[
"LB",
"CB",
"LM"
];

break;

case"LW":

posiciones=[
"RB",
"CB",
"RM"
];

break;

case"RW":

posiciones=[
"LB",
"CB",
"LM"
];

break;

case"ST":

posiciones=[
"CB",
"CDM"
];

break;

default:

posiciones=[
"ST",
"CAM",
"CM",
"CDM"
];

}

return lista.filter(
j=>
posiciones.includes(
j.posicion
)
);

}


function encontrarInterceptor(
pasador,
receptor,
equipoDefensor
){

const candidatos=
candidatosIntercepcion(
pasador,
equipoDefensor
);

if(candidatos.length===0)
return null;

let mejor=null;

let mejorDistancia=Infinity;

for(
const jugador of candidatos
){

const d=
distancia(
jugador.coord,
receptor.coord
);

if(d<mejorDistancia){

mejorDistancia=d;

mejor=jugador;

}

}

return mejor;

}


/* ==================================================
   PASE
================================================== */

function ejecutarPase(
pasador,
receptor,
equipoDefensor,
minuto
){

debug(
`${pasador.nombre} intenta pasar a ${receptor.nombre}`,
"action"
);

const potencia=
pasador.stats.POW+
bonus();

const precision=
pasador.stats.TEC+
bonus();

debug(
`PASE → POW ${potencia} / TEC ${precision}`,
"stat"
);

const interceptor=
encontrarInterceptor(
pasador,
receptor,
equipoDefensor
);

if(interceptor){

const velocidad=
interceptor.stats.SPD+
bonus();

const dificultad=
Math.max(
1,
potencia
);

debug(
`${interceptor.nombre}: SPD ${velocidad} VS potencia ${dificultad}`,
"stat"
);

if(
velocidad+
interceptor.stats.DEF
>
dificultad+
precision/2
){

if(
Math.random()<.16
){

evento(
minuto,
`${interceptor.nombre} comete falta`,
"falta"
);

debug(
"INTERCEPCIÓN → FALTA",
"result"
);

balon.x=
interceptor.coord.x;

balon.y=
interceptor.coord.y;

balon.equipo=
pasador.equipo;

balon.jugador=
pasador;

return{
resultado:"falta"
};

}

debug(
`${interceptor.nombre} INTERCEPTA`,
"result"
);

balon.x=
interceptor.coord.x;

balon.y=
interceptor.coord.y;

balon.equipo=
interceptor.equipo;

balon.jugador=
interceptor;

return{
resultado:"intercepcion",
jugador:interceptor
};

}

}


/*
   TEC BAJO = posibilidad de error.
*/

const errorTec=
Math.random()*4;

if(
precision+
errorTec<
5
){

const nuevoX=
Math.max(
0,
Math.min(
8,
receptor.coord.x+
(
Math.random()<.5
?
-1
:
1
)
)
);

const nuevoY=
Math.max(
0,
Math.min(
6,
receptor.coord.y+
Math.floor(
Math.random()*3
)-1
)
);

debug(
`TEC insuficiente → pase desviado`,
"result"
);

evento(
minuto,
`${pasador.nombre} falla el pase`,
"fallo"
);

balon.x=
nuevoX;

balon.y=
nuevoY;

balon.jugador=null;

return{
resultado:"pase_malo"
};

}

balon.x=
receptor.coord.x;

balon.y=
receptor.coord.y;

balon.equipo=
pasador.equipo;

balon.jugador=
receptor;

debug(
`Pase completado → ${receptor.nombre}`,
"result"
);

return{
resultado:"completo",
jugador:receptor
};

}

/* ==================================================
   JUGADORES CERCANOS
================================================== */

function jugadoresCercanos(
jugador,
equipo,
distanciaMax=2
){

return equipo.once.filter(
j=>
j!==jugador &&
distancia(
j.coord,
jugador.coord
)<=distanciaMax
);

}


/* ==================================================
   COMPAÑERO
================================================== */

function elegirCompañero(
jugador,
equipo
){

const compañeros=
equipo.once.filter(
j=>
j!==jugador
);

if(
compañeros.length===0
)
return null;

const zona=
zonaDe(
jugador.coord.x
);

const banda=
bandaDe(
jugador.coord.y
);

let candidatos=
compañeros.filter(
j=>{

if(
banda==="IZQUIERDA" &&
j.coord.y<=3
)
return true;

if(
banda==="DERECHA" &&
j.coord.y>=3
)
return true;

return zonaDe(
j.coord.x
)!==
zona;

}
);

if(
candidatos.length===0
)
candidatos=compañeros;

candidatos.sort(
(a,b)=>
distancia(
jugador.coord,
a.coord
)-
distancia(
jugador.coord,
b.coord
)
);

return candidatos[
Math.floor(
Math.random()*
Math.min(
3,
candidatos.length
)
)
];

}


/* ==================================================
   DEFENSOR CERCANO
================================================== */

function defensorCercano(
jugador,
equipoDefensor
){

let mejor=null;

let mejorDistancia=Infinity;

for(
const defensor of equipoDefensor.once
){

const d=
distancia(
jugador.coord,
defensor.coord
);

if(d<mejorDistancia){

mejorDistancia=d;

mejor=defensor;

}

}

return mejor;

}


/* ==================================================
   TIRO
================================================== */

function ejecutarTiro(
atacante,
portero,
minuto
){

debug(
`${atacante.nombre} decide tirar`,
"action"
);

const potencia=
atacante.stats.POW+
bonus();

const tecnica=
atacante.stats.TEC+
bonus();

const parada=
portero.stats.KEP+
bonus();

debug(
`TIRO → POW ${potencia} / TEC ${tecnica} VS KEP ${parada}`,
"stat"
);


/*
   TEC importa directamente.
   Un delantero con mala TEC puede fallar.
*/

const precisionMinima=
Math.max(
1,
tecnica
);

const peligro=
potencia+
precisionMinima;

const defensa=
parada*2+
bonus();


/*
   Parada.
*/

if(
peligro<=defensa
){

debug(
`${portero.nombre} realiza la parada`,
"result"
);

evento(
minuto,
`${portero.nombre} realiza una parada`,
"parada"
);

balon.x=
portero.coord.x;

balon.y=
portero.coord.y;

balon.equipo=
portero.equipo;

balon.jugador=
portero;

return"parada";

}


/*
   TEC muy baja:
   disparo defectuoso.
*/

if(
tecnica<=3 &&
Math.random()<.32
){

debug(
`${atacante.nombre} falla el disparo por TEC insuficiente`,
"result"
);

evento(
minuto,
`${atacante.nombre} falla el disparo`,
"fallo"
);

/* El fallo también termina la posesión atacante. */
balon={
x:portero.coord.x,
y:portero.coord.y,
equipo:portero.equipo,
jugador:portero
};

return"fuera";

}


/*
   Gol.
*/

const calidad=
peligro-
defensa;

/*
   Probabilidad de gol equilibrada.

   La versión anterior llegaba hasta 42% por tiro.
   Como un partido puede generar muchos tiros, eso hacía
   que las goleadas absurdas fueran demasiado frecuentes.
   Ahora la calidad sigue importando, pero el tiro necesita
   ser realmente bueno para convertirse en gol.
*/
const probabilidad=
Math.min(
.20,
Math.max(
.01,
.035+
calidad*.025
)
);

debug(
`Probabilidad final de gol: ${(probabilidad*100).toFixed(1)}%`,
"stat"
);

if(
Math.random()<
probabilidad
){

equipos[
atacante.equipo
].goles++;

evento(
minuto,
`¡GOL DE ${atacante.nombre}!`,
"gol"
);

debug(
`GOL → ${atacante.nombre}`,
"result"
);

balon={

x:4,

y:3,

equipo:
atacante.equipo,

jugador:null

};

return"gol";

}


/*
   Tiro fuera.
*/

evento(
minuto,
`${atacante.nombre} dispara fuera`,
"fallo"
);

debug(
"TIRO → FUERA",
"result"
);

/*
   Un tiro que termina fuera NO deja al atacante con el balón.
   Se concede la posesión al portero rival para provocar un
   reinicio de jugada y evitar tiros consecutivos infinitos.
*/
balon={
x:portero.coord.x,
y:portero.coord.y,
equipo:portero.equipo,
jugador:portero
};

return"fuera";

}

/* ==================================================
   AVANCE
================================================== */

function ejecutarAvance(
jugador,
equipoDefensor,
minuto
){

debug(
`${jugador.nombre} decide avanzar`,
"action"
);

const defensor=
defensorCercano(
jugador,
equipoDefensor
);

if(
!defensor ||
distancia(
jugador.coord,
defensor.coord
)>2.2
){

const anteriorX=
jugador.coord.x;

avanzarCoordenada(
jugador
);

balon.x=
jugador.coord.x;

balon.y=
jugador.coord.y;

debug(
`${jugador.nombre} avanza sin oposición`,
"result"
);


/*
   Llegó al último sector:
   acercamiento peligroso.
*/

const distanciaPorteria=
jugador.equipo===
codigoLocal
?
8-jugador.coord.x
:
jugador.coord.x;

if(
distanciaPorteria<=1 &&
anteriorX!==jugador.coord.x
){

registrarAcercamiento(
jugador,
minuto
);

}

return{
resultado:"avance"
};

}

return{

resultado:
ejecutarDrible(
jugador,
defensor,
minuto
)
?
"avance"
:
"perdida"

};

}


/* ==================================================
   DECISION DEL ATACANTE
================================================== */

function decidirAccion(
jugador,
equipo,
rival,
minuto
){

const zona=
zonaDe(
jugador.coord.x
);

const banda=
bandaDe(
jugador.coord.y
);

debug(
`${jugador.nombre} → ${jugador.posicion} / ${zona} / ${banda}`,
"turn"
);


/*
   DISTANCIA A PORTERIA
*/

const distanciaPorteria=
equipo.codigo===
codigoLocal
?
8-jugador.coord.x
:
jugador.coord.x;


/*
   ZONA DE DISPARO
*/

if(
distanciaPorteria<=1
){

const portero=
rival.once.find(
j=>j.posicion==="GK"
);

if(portero){

registrarAcercamiento(
jugador,
minuto
);

const decision=
Math.random();

if(
decision<.55
){

return ejecutarTiro(
jugador,
portero,
minuto
);

}

if(
decision<.80
){

const defensor=
defensorCercano(
jugador,
rival
);

if(defensor){

return ejecutarDrible(
jugador,
defensor,
minuto
)
?
"avance"
:
"perdida";

}

}

}

}


/*
   PRESIÓN
*/

const defensor=
defensorCercano(
jugador,
rival
);

if(
defensor &&
distancia(
jugador.coord,
defensor.coord
)<=1.7
){

if(
jugador.stats.DRI+
bonus()
>
defensor.stats.DEF+
bonus()
){

return ejecutarDrible(
jugador,
defensor,
minuto
)
?
"avance"
:
"perdida";

}

}


/*
   PASE
*/

const compañero=
elegirCompañero(
jugador,
equipo
);

if(compañero){

const probPase=
jugador.stats.TEC/10;

if(
Math.random()<
.35+
probPase*.4
){

return ejecutarPase(
jugador,
compañero,
rival,
minuto
);

}

}


/*
   AVANCE
*/

return ejecutarAvance(
jugador,
rival,
minuto
);

}

balon

);

ladoLocal.length===0 &&
ladoVisitante.length===0
)
return null;

if(
ladoLocal.length>0 &&
ladoVisitante.length>0
){

const a=
ladoLocal[
Math.floor(
Math.random()*
ladoLocal.length
)
];

const b=
ladoVisitante[
Math.floor(
Math.random()*
ladoVisitante.length
)
];

const ataque=
a.stats.DRI+
bonus();

const defensa=
b.stats.DEF+
bonus();

debug(

);

if(
ataque>defensa
){

balon.equipo=
local.codigo;

balon.jugador=a;

return a;

}

balon.equipo=
visitante.codigo;

balon.jugador=b;

return b;

}

if(
ladoLocal.length>0
){

const jugador=
ladoLocal[
Math.floor(
Math.random()*
ladoLocal.length
)
];

balon.equipo=
local.codigo;

balon.jugador=
jugador;

return jugador;

}

const jugador=
ladoVisitante[
Math.floor(
Math.random()*
ladoVisitante.length
)
];

balon.equipo=
visitante.codigo;

balon.jugador=
jugador;

return jugador;

}

].includes(
j.posicion
)
);

const inicio=
medios.length>0
?
medios[
Math.floor(
Math.random()*
medios.length
)
]
:
local.once[0];

balon={

x:inicio.coord.x,

y:inicio.coord.y,

equipo:codigoLocal,

jugador:inicio

};

partido.activo=true;

partido.pausado=false;

partido.minuto=0;

partido.turno=0;

progreso.style.width="0%";

actualizarMarcador();

actualizarEstado();

actualizarCancha();

ponerTexto(
mensaje,
"READY"
);

debug(
"==========================================",
"turn"
);

debug(
"PARTIDO PREPARADO.",
"result"
);

debug(
"Las coordenadas iniciales provienen de Team_XI.",
"result"
);

return true;

}catch(error){

console.error(error);

debug(
"ERROR: "+
error.message,
"result"
);

ponerTexto(
mensaje,
"ERROR"
);

return false;

}

}


/* ==================================================
   PASO
================================================== */

function ejecutarPaso(){

if(
!partido.activo ||
partido.pausado
)
return;

if(
partido.turno>=
partido.totalTurnos
){

terminarPartido();

return;

}

partido.turno++;

partido.minuto=
Math.min(
90,
Math.floor(
partido.turno/6
)
);

try{

ejecutarTurno(
partido.minuto
);

}catch(error){

console.error(error);

debug(
"ERROR EN TURNO: "+
error.message,
"result"
);

partido.pausado=true;

actualizarEstado();

return;

}

actualizarMarcador();

actualizarEstado();

progreso.style.width=
(
partido.turno/
partido.totalTurnos*
100
)+"%";


/*
   Gol → reinicio.
*/

if(
balon.equipo &&
balon.jugador===null
){

const local=
obtenerLocal();

const visitante=
obtenerVisitante();

if(
balon.x===4 &&
balon.y===3 &&
(
balon.equipo===
local.codigo ||
balon.equipo===
visitante.codigo
)
){

reiniciarDespuesGol();

}

}

}


/* ==================================================
   TERMINAR
================================================== */

function terminarPartido(){

partido.activo=false;

partido.pausado=false;

if(temporizador){

clearInterval(
temporizador
);

temporizador=null;

}

partido.minuto=90;

progreso.style.width="100%";

actualizarMarcador();

actualizarEstado();

const local=
obtenerLocal();

const visitante=
obtenerVisitante();

evento(
90,
`FINAL: ${local.codigo} ${local.goles} - ${visitante.goles} ${visitante.codigo}`,
"final"
);

debug(
"==========================================",
"turn"
);

debug(
`FINAL DEL PARTIDO: ${local.codigo} ${local.goles} - ${visitante.goles} ${visitante.codigo}`,
"result"
);

ponerTexto(
mensaje,
"FULL TIME"
);

}

codigo===
